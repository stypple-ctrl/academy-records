<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>학원 기록관리 · 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* ============ design tokens ============ */
:root{
  --bg:#f1f4f3;--surf:#f6f8f7;--card:#ffffff;--line:#e6ebe9;--line2:#d9e0dd;--text:#15201c;--muted:#6b7874;--faint:#a2adaa;
  --acc:#1f9d7a;--acc2:#4cc19f;--acc-soft:#e3f4ee;--acc-ink:#116a50;
  --red:#e2604b;--red-soft:#fdeceA;--amber:#e2992b;--amber-soft:#fdf2de;--blue:#4775de;--blue-soft:#e8eefc;--gray-soft:#edf1ef;
  --shadow:0 1px 2px rgba(16,40,32,.04),0 8px 24px rgba(16,40,32,.05);
  --shadow-lg:0 2px 4px rgba(16,40,32,.05),0 16px 40px rgba(16,40,32,.10);
  /* 버튼만 살짝 볼록한 느낌 (참고 이미지 1) */
  --raise:0 1px 0 rgba(255,255,255,.9) inset,0 2px 6px rgba(16,40,32,.10),0 1px 2px rgba(16,40,32,.06);
  --raise-sm:0 1px 0 rgba(255,255,255,.9) inset,0 1px 3px rgba(16,40,32,.12);
  --inset:inset 0 1px 3px rgba(16,40,32,.10);
  --r:20px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;cursor:pointer}
.small{font-size:12px}.muted{color:var(--muted)}.b{font-weight:700}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em}
h2{font-size:24px;font-weight:800}h3{font-size:15.5px;font-weight:700}h4{font-size:14px;font-weight:700}
.num{font-variant-numeric:tabular-nums}

/* ============ layout ============ */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;padding:2px 10px 22px;white-space:nowrap}
.logo .mk{width:34px;height:34px;border-radius:11px;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 4px 10px rgba(31,157,122,.35)}
.logo .demo{font-size:10px;font-weight:700;color:var(--acc-ink);background:var(--acc-soft);padding:2px 7px;border-radius:99px}
.navb{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:12px;border:0;background:transparent;cursor:pointer;text-align:left;color:var(--muted);font-weight:600;white-space:nowrap;transition:.12s}
.navb svg{width:19px;height:19px;flex:none}
.navb:hover{color:var(--text);background:var(--surf)}
.navb.on{background:var(--acc);color:#fff;box-shadow:0 4px 12px rgba(31,157,122,.30)}
.side .grow{flex:1}
.promo{border-radius:16px;background:var(--acc-soft);padding:16px;font-size:12px;color:var(--acc-ink);line-height:1.55}
.promo b{display:block;font-size:14px;margin-bottom:4px;color:var(--text)}
.main{padding:26px 32px 64px;min-width:0;max-width:1480px;width:100%}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.topbar .ttl{flex:1;min-width:200px}
.topbar .crumb{font-size:12px;color:var(--muted);margin-top:2px}
.me{display:flex;align-items:center;gap:10px;padding:5px 6px 5px 5px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--acc);font-size:12.5px;flex:none}
.av.lg{width:88px;height:88px;font-size:30px;border-radius:26px}
.me .nm{font-weight:700;font-size:13px;line-height:1.15}.me .rl{font-size:11px;color:var(--muted)}
.datechip{font-size:12.5px;color:var(--muted);font-weight:600;padding:9px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line)}

/* ============ cards & grid ============ */
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow);padding:20px 22px;min-width:0}
.card.flat{box-shadow:none;border:0;background:var(--surf)}
.card.in{box-shadow:none;border:1px dashed var(--line2);background:var(--surf)}
.chead{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.chead h3{flex:1}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1.4fr 1fr}.g2e{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.gside{grid-template-columns:300px 1fr}
.grid>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mb{margin-bottom:18px}
.kgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:520px){.kgrid{grid-template-columns:1fr}}
@media (max-width:1180px){.g5{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:980px){.g2,.g2e,.g3,.gside{grid-template-columns:1fr}}

/* ============ buttons (soft raised pills) ============ */
.btn{text-decoration:none;border:0;border-radius:99px;padding:9px 18px;background:linear-gradient(#fdfefe,#f0f3f2);box-shadow:var(--raise);cursor:pointer;font-weight:600;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;color:var(--text)}
.btn:hover{filter:brightness(.98);transform:translateY(-1px)}
.btn:active{box-shadow:var(--inset);transform:none}
.btn.pri{background:linear-gradient(#27ab87,#1c9271);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 4px 12px rgba(31,157,122,.32)}
.btn.dark{background:linear-gradient(#a3adaa,#8e9895);color:#fff}
.btn.sm{padding:6px 13px;font-size:12.5px}
.btn.ghost{box-shadow:none;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surf);color:var(--text)}
.btn.icon{padding:7px;border-radius:10px}
.btn:disabled{opacity:.4;box-shadow:none;cursor:not-allowed;transform:none}
.btn svg{width:15px;height:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:99px;padding:8px 14px;background:var(--card);cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);transition:.12s;white-space:nowrap}
.chip:hover{color:var(--text);border-color:var(--line2)}
.chip.on{color:var(--acc-ink);background:var(--acc-soft);border-color:var(--acc2)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-left:6px;vertical-align:middle}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.seg{display:inline-flex;padding:4px;border-radius:99px;box-shadow:var(--inset);background:var(--gray-soft);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:99px;padding:7px 13px;white-space:nowrap;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:.12s}
.seg button:hover:not(:disabled){color:var(--text)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--raise-sm)}
.seg button.on.g{background:var(--acc);color:#fff}.seg button.on.a{background:var(--amber);color:#fff}.seg button.on.r{background:var(--red);color:#fff}.seg button.on.b{background:var(--blue);color:#fff}
.seg.full{display:flex}.seg.full button{flex:1}
.tabs{margin-bottom:18px}
.tabs button{padding:9px 18px;font-size:13.5px}
input[type=text],input[type=number],input[type=date],input:not([type]),select,textarea{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--card);outline:none;width:100%;transition:.12s}
input:focus,select:focus,textarea:focus{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(76,193,159,.18)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8a969b 50%),linear-gradient(135deg,#8a969b 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px;cursor:pointer}
.filters select{flex:1 1 140px;width:auto;min-width:130px;padding:8px 30px 8px 12px;font-size:13px}
label.lb{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:16px 0 8px}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:13px}
.toggle i{width:44px;height:26px;border-radius:99px;box-shadow:var(--inset);background:var(--gray-soft);position:relative;transition:.2s;flex:none}
.toggle i:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.toggle input{display:none}
.toggle input:checked+i{background:var(--acc)}
.toggle input:checked+i:after{left:21px}

/* ============ badges ============ */
.bd{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.bd.g{background:var(--acc-soft);color:var(--acc-ink)}.bd.r{background:var(--red-soft);color:#b83f2c}.bd.a{background:var(--amber-soft);color:#a26411}.bd.b{background:var(--blue-soft);color:#2f59b8}.bd.n{background:var(--gray-soft);color:var(--muted)}

/* ============ KPI & todo ============ */
.kpi{display:flex;align-items:center;gap:14px}
.kpi.click{cursor:pointer;transition:.15s}.kpi.click:hover{border-color:var(--acc2);transform:translateY(-2px)}
.kpi .kt{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .kv{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .ks{font-size:11.5px;color:var(--muted)}
.ring-bg{fill:none;stroke:var(--gray-soft);stroke-width:7}
.ring-fg{fill:none;stroke-width:7;stroke-linecap:round;transition:stroke-dasharray .6s}
.ring-t{font-weight:800;font-size:15px;fill:var(--text)}
.ring-s{font-size:9px;fill:var(--muted)}
.todo{display:flex;align-items:center;gap:12px;padding:12px 12px;border-radius:14px;cursor:pointer;transition:.12s}
.todo+.todo{border-top:1px solid var(--line)}
.todo:hover{background:var(--surf)}
.todo .tic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.todo .tt{font-weight:700}.todo .ts{font-size:12px;color:var(--muted)}
.todo .tc{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.todo .chev{color:var(--faint);font-size:18px}
.stat{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.stat .sv{font-size:20px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}.stat .sl{font-size:12px;color:var(--muted)}

/* ============ charts ============ */
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{font-size:10px;fill:var(--faint)}
.bars{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:18px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;height:100%}
.btrack{flex:1;width:100%;max-width:34px;border-radius:9px;background:var(--gray-soft);position:relative;display:flex;flex-direction:column-reverse;overflow:hidden}
.bfill{width:100%;transition:height .5s}
.bval{font-size:11px;font-weight:700}
.blab{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
.hbar{height:10px;border-radius:99px;background:var(--gray-soft);overflow:hidden;display:flex}
.hbar span{display:block;height:100%}
.meter{height:8px;border-radius:99px;background:var(--gray-soft);overflow:hidden;min-width:60px}
.meter span{display:block;height:100%;border-radius:99px;background:var(--acc)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;font-size:11px;text-align:center}
.cal .h{color:var(--faint);font-weight:600;padding-bottom:2px}
.cal .d{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-weight:600;color:var(--muted);background:var(--surf)}
.cal .d.l1{background:#d3efe5;color:var(--acc-ink)}.cal .d.l2{background:#93d7c1;color:#0d5640}.cal .d.l3{background:var(--acc);color:#fff}
.cal .d.t{outline:2px solid var(--acc);outline-offset:1px}
.formula{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--surf);border-radius:12px;padding:10px 12px;line-height:1.7}
.formula b{color:var(--acc-ink)}.formula .bad{color:var(--red);font-weight:700}

/* ============ flow: 발견 → 조치 → 결과 ============ */
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.flow .st{flex:1;min-width:110px;background:var(--surf);border-radius:12px;padding:8px 11px;font-size:12.5px;position:relative}
.flow .st .k{font-size:10.5px;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.flow .ar{display:grid;place-items:center;width:22px;color:var(--faint);font-weight:700}
.flowbig{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flowbig .nd{flex:1;min-width:80px;text-align:center;padding:14px 8px;border-radius:16px;background:var(--surf)}
.flowbig .nd .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}.flowbig .nd .t{font-size:11.5px;color:var(--muted)}
.flowbig .arw{color:var(--acc);font-weight:800}

/* ============ list items ============ */
.ci{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.ci:last-of-type{border-bottom:0}
.ci .rk{width:44px;flex:none;text-align:center}
.ci .main2{flex:1;min-width:0}
.ci .nm{font-weight:700;font-size:14.5px}
.ci .why{font-size:13px;color:var(--text);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .more{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .acts{display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-end;flex:none}
@media (max-width:640px){.ci{flex-wrap:wrap}.ci .acts{width:100%;justify-content:flex-start}}
.tblw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--line);background:var(--surf)}
table.t th:first-child{border-radius:10px 0 0 10px}table.t th:last-child{border-radius:0 10px 10px 0}
table.t td{padding:11px 10px;vertical-align:middle;border-bottom:1px solid var(--line)}
table.t tr:last-child td{border-bottom:0}
table.t td:first-child{white-space:nowrap}
table.t .seg{flex-wrap:nowrap}
table.t tr.click td{cursor:pointer}table.t tr.click:hover td{background:var(--acc-soft)}
.empty{color:var(--muted);text-align:center;padding:28px;font-size:13px}
.hwb{width:36px;height:36px;border-radius:11px;border:0;cursor:pointer;font-weight:800;background:linear-gradient(#fdfefe,#f0f3f2);box-shadow:var(--raise-sm);color:var(--faint)}
.hwb.O{color:var(--acc-ink);background:var(--acc-soft);box-shadow:var(--inset)}.hwb.△{color:#a26411;background:var(--amber-soft);box-shadow:var(--inset)}.hwb.X{color:#b83f2c;background:var(--red-soft);box-shadow:var(--inset)}
.scin{width:74px!important;text-align:center;font-weight:700}

/* ============ remedial cards ============ */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px}
.rc{padding:18px}
.rc .rrow{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.rc .lab{font-size:11.5px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px}
.rc .rg{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-top:12px}
.rc .rg .seg{display:flex}.rc .rg .seg button{flex:1;padding:7px 4px}
.rc .rg .wide{grid-column:1/-1}
.task{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--surf);margin-top:6px;font-size:13px;font-weight:600}
.tpill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--surf);font-size:12.5px;font-weight:600}
.due{animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(226,96,75,.18)}}

/* ============ timeline ============ */
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tld{font-size:12px;font-weight:700;color:var(--muted);margin:16px 0 8px;position:relative}
.tld:before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--card);box-shadow:0 0 0 3px var(--acc-soft),0 0 0 4px var(--acc)}
.ev{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:12px;background:var(--surf);margin-bottom:6px;font-size:13px}
.ev .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:12px;font-weight:800}

/* ============ modal & toast ============ */
.mbg{position:fixed;inset:0;background:rgba(18,32,28,.32);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--card);border-radius:24px;box-shadow:var(--shadow-lg);width:min(640px,100%);max-height:90vh;overflow:auto;padding:26px}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1d2a26;color:#fff;box-shadow:var(--shadow-lg);border-radius:14px;padding:12px 18px;font-weight:600;z-index:60;display:flex;align-items:center;gap:10px;animation:up .25s;max-width:calc(100% - 32px)}
.toast .ck{width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.toast.err .ck{background:var(--red)}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}
.stepper{display:flex;gap:5px;align-items:center;font-size:11.5px;color:var(--muted);font-weight:600}
.stepper i{width:18px;height:6px;border-radius:99px;background:var(--gray-soft)}.stepper i.on{background:var(--acc)}

/* ============ login ============ */
.login{max-width:1120px;margin:0 auto;padding:56px 24px;display:grid;grid-template-columns:1fr 1.1fr;gap:48px;align-items:start}
.login h1{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:22px 0 10px;line-height:1.25}
.lgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.lcard{border:1px solid var(--line);text-align:left;cursor:pointer;background:var(--card);box-shadow:var(--shadow);border-radius:20px;padding:18px;transition:.15s}
.lcard:hover{transform:translateY(-3px);border-color:var(--acc2);box-shadow:var(--shadow-lg)}
.lcard:active{transform:none}
.lcard .rtag{display:inline-block;margin-top:12px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px}
.steps{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.steps .s{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;line-height:1.55}
.steps .n{width:26px;height:26px;border-radius:50%;background:var(--acc-soft);color:var(--acc-ink);display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none}
@media (max-width:900px){.login{grid-template-columns:1fr;padding:32px 16px;gap:28px}}

/* ============ 학부모 리포트 ============ */
.pv{max-width:420px;margin:0 auto;background:#fff;border-radius:28px;box-shadow:var(--shadow-lg);border:1px solid var(--line);overflow:hidden}
.pv-top{background:linear-gradient(135deg,#22a882,#178466);color:#fff;padding:24px 22px 28px}
.pv-top .ac{font-size:12px;opacity:.85;font-weight:600}.pv-top h2{color:#fff;font-size:22px;margin-top:6px}
.pv-ban{background:var(--amber-soft);color:#a26411;font-weight:700;font-size:12.5px;text-align:center;padding:8px}
.pv-sec{padding:18px 22px;border-top:1px solid var(--line)}

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
/* ============ utils ============ */
const TODAY='2026-10-01';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D=s=>new Date(s+'T00:00:00');
const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return fmt(d)};
const diff=(a,b)=>Math.round((D(a)-D(b))/864e5);
const md=s=>s?`${+s.slice(5,7)}/${+s.slice(8,10)}`:'';
const byDate=(a,b)=>a.date<b.date?-1:a.date>b.date?1:0;
const avg=a=>a.length?a.reduce((x,y)=>x+(y.score??y),0)/a.length:null;
const pct=v=>v==null?'–':Math.round(v*100)+'%';
const nowHM=()=>{const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const WD='일월화수목금토';
let seed=1;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const pick=a=>a[Math.floor(rnd()*a.length)];const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
let uid=0;const nid=p=>p+(++uid);
let gid=0;

/* ============ code tables ============ */
const ROLE={director:'원장',teacher:'담임 교사',native_teacher:'원어민 교사',assistant:'조교'};
const AREAS={word:'단어',listening:'듣기',reading:'독해',grammar:'문법',essay:'에세이',speaking:'스피킹',attitude:'숙제·태도'};
const NATIVE_AREAS=['essay','speaking','attitude'];
const TYPES={repeat:'반복 오답',drop:'점수 하락',missing:'미제출 반복',concept:'개념 이해 부족',behavior:'수업 태도',positive:'긍정 변화'};
const ACTIONS={retest:'재시험',extra:'추가 숙제',oneone:'1:1 재설명',recheck:'수업 중 재확인',seat:'자리 조정',parent:'학부모 연락',praise:'칭찬',etc:'기타'};
const RESULTS={improved:'개선',same:'유지',worse:'악화'};
const HW={listening:'듣기',reading:'독해',grammar:'문법',essay:'에세이',speaking:'스피킹 영상'};
const OUTCOME={done:'완료',partial:'부분',incomplete:'미완'};
const PASS={'10':'10분 이내','30':'30분 이내','60':'1시간'};
const ATT={focus:'집중',normal:'보통',distract:'산만'};
const DAYN={MWF:'월수금',TT:'화목'};
const COL={g:'var(--acc)',g2:'var(--acc2)',r:'var(--red)',a:'var(--amber)',b:'var(--blue)',n:'#c5cdd1'};
const RANK={1:['확인','b'],2:['경고','r'],3:['칭찬','g'],4:['공백','n']};

/* ============ icons ============ */
const IC={
 alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
 dash:'<path d="M4 13h6V4H4zM14 20h6V11h-6zM4 20h6v-4H4zM14 7h6V4h-6z"/>',
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/>',
 run:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/>',
 file:'<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
 star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3.6 15H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.1-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9.6 4V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1.3z"/>',
 dl:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 check:'<path d="M5 12l5 5 9-10"/>',
 swap:'<path d="M7 7h13l-4-4M17 17H4l4 4"/>',
 spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/>',
};
const ic=(k,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;

/* ============ demo data ============ */
let DB;
function isClassDay(c,date){const w=D(date).getDay();if(c.days=='MWF')return[1,3,5].includes(w);if(c.days=='TT')return[2,4].includes(w);return w==+c.days.slice(1)}
const dayLabel=c=>DAYN[c.days]||(WD[+c.days.slice(1)]+'요일');

function buildData(){
  seed=20261001;uid=0;
  const db={users:[
    {id:'D1',name:'앤디',role:'director',active:true},
    {id:'T1',name:'김지현',role:'teacher',active:true},{id:'T2',name:'박서준',role:'teacher',active:true},
    {id:'T3',name:'이수민',role:'teacher',active:true},{id:'T4',name:'정하늘',role:'teacher',active:true},
    {id:'N1',name:'Emily Carter',role:'native_teacher',active:true},
    {id:'A1',name:'최유진',role:'assistant',active:true},{id:'A2',name:'한도윤',role:'assistant',active:true}],
    classes:[],students:[],sessions:[],att:[],scores:[],hw:[],care:[],tickets:[],logs:[],showcase:[],comments:{},suggestions:[],
    extra:[
      {id:'E1',level:'all',title:'다음 단어 범위 예습 (Day+1)',active:true},{id:'E2',level:'all',title:'듣기 받아쓰기 1트랙',active:true},
      {id:'E3',level:'all',title:'독해 1지문',active:true},{id:'E4',level:'all',title:'원서 읽기 10쪽',active:true},
      {id:'E5',level:'Starter',title:'파닉스 카드 20장',active:true},{id:'E6',level:'Advanced',title:'문법 심화 1세트',active:true},{id:'E7',level:'Master',title:'문법 심화 1세트',active:true}],
    settings:{pass:24,dropPct:20,gapDays:14,fastPass:3,incompleteRisk:3,riskDropPct:15,worseRisk:2,riskGapDays:21,maxCare:5,newWeeks:8,churnHigh:50,churnWatch:25}};
  const TG={T1:['초4','초5'],T2:['초5','초6'],T3:['초6','중1'],T4:['중1','중2']};
  const LV={'초4':'Starter','초5':'Basic','초6':'Inter','중1':'Advanced','중2':'Master'};
  const SLOTS=[['MWF','16:00'],['MWF','17:00'],['TT','16:00'],['TT','19:00']];
  let L=0;
  for(const t of ['T1','T2','T3','T4'])SLOTS.forEach(([days,start],i)=>{
    const grade=TG[t][i%2];
    db.classes.push({id:'C'+t[1]+(i+1),name:`${grade} ${LV[grade]} ${'ABCDEFGHIJKLMNOP'[L++]}`,type:'homeroom',days,start,teacher:t,level:LV[grade],grade,
      planned:grade[0]=='초'?30:24,termStart:'2026-09-01',textbook:LV[grade]+' 세트'});
  });
  ['월','화','수','목'].forEach((d,i)=>db.classes.push({id:'NC'+(i+1),name:`Essay·Speaking ${d}`,type:'native',days:'W'+(i+1),start:'18:00',teacher:'N1',level:'-',grade:'원어민'}));

  const SUR='김이박최정강조윤장임한오서신권황안송류홍'.split('');
  const GIV=['서준','하은','민준','지우','도윤','서연','시우','하린','예준','지아','주원','수아','지호','윤서','건우','채원','우진','지민','선우','다은','현우','소율','유준','예린','연우','아린','은우','나윤','지훈','서아'];
  const PAT=['drop','normal','fail2','normal','rise','normal','hwmiss','normal','absent','normal','remedial3','normal','fastpass','normal','gap','normal','worse','normal','slump','normal','normal','normal','normal','normal'];
  let k=0;
  db.classes.filter(c=>c.type=='homeroom').forEach(c=>{
    for(let i=0;i<6;i++){
      const pat=PAT[k%PAT.length];k++;
      let ab=22+rnd()*6.5;
      if(pat=='fail2')ab=26;if(pat=='rise')ab=21;if(pat=='slump')ab=27.5;if(pat=='remedial3'||pat=='fastpass')ab=21.5;
      db.students.push({id:'S'+k,name:pick(SUR)+pick(GIV),grade:c.grade,school:pick(c.grade[0]=='초'?['한빛초','새솔초','푸른초']:['대림중','하늘중']),
        cls:c.id,homeroom:c.teacher,nclass:'NC'+(1+k%4),status:'재원',phone:`010-${ri(2000,9999)}-${ri(1000,9999)}`,pattern:pat,ability:ab,level:c.level,subjects:['담임 영어','원어민']});
    }
  });

  // sessions (8월 = 전 학기 비교용, 9/1 학기 시작)
  db.classes.filter(c=>c.type=='homeroom').forEach(c=>{
    let no=0,idx=0;
    for(let d='2026-08-03';d<=TODAY;d=addDays(d,1)){
      if(!isClassDay(c,d))continue;
      const inTerm=d>=c.termStart;
      const s={id:nid('SS'),cls:c.id,date:d,no:null,regular:true,note:'',items:['listening','reading','grammar'].concat(idx%3==0?['essay']:[]),pending:false,inTerm};
      idx++;
      if(inTerm){
        if(c.id=='C43'&&idx%2==0){s.regular=false;s.note='레벨테스트·학교 행사'}
        else{s.no=++no;s.note=`${c.textbook} Unit ${Math.ceil(no/2)}`}
      }
      if(d==TODAY&&c.start>='19:00')s.pending=true;
      db.sessions.push(s);
    }
  });

  // attendance / scores / homework
  db.students.forEach(st=>{
    const ss=db.sessions.filter(s=>s.cls==st.cls&&!s.pending);const n=ss.length;const sc=[];
    ss.forEach((s,i)=>{
      const fe=n-1-i;
      let absent=rnd()<0.03&&fe>2;if(st.pattern=='absent'&&fe==0)absent=true;
      db.att.push({sid:st.id,sess:s.id,date:s.date,status:absent?'absent':(rnd()<0.04?'late':'present')});
      if(absent)return;
      let ab=st.ability;if(st.pattern=='slump'&&s.date>addDays(TODAY,-28))ab-=7;
      let v=Math.round(ab+(rnd()+rnd()-1)*4);
      if(st.pattern=='drop'&&fe==0){const p=sc.slice(-3);v=Math.round(p.reduce((a,b)=>a+b,0)/p.length*0.66)}
      if(st.pattern=='fail2'&&fe<=1)v=ri(19,22);
      if(st.pattern=='rise'&&fe<=2)v=[26,28,30][2-fe];
      v=Math.max(0,Math.min(30,v));sc.push(v);
      db.scores.push({id:nid('SC'),sid:st.id,sess:s.id,date:s.date,type:'word',score:v,max:30,passed:v>=24});
      s.items.forEach(it=>{
        const p=ab>=26?0.9:0.8,r=rnd();
        let stt=r<p?'O':r<p+0.11?'△':'X';
        if(st.pattern=='hwmiss'&&fe<=1&&it=='reading')stt='X';
        db.hw.push({sid:st.id,sess:s.id,date:s.date,item:it,status:stt});
      });
    });
  });

  // care records
  const FIND={repeat:['과거완료 시제 문제 반복 오답','관계대명사 which/that 구분 반복 오답','단어 철자 -tion/-sion 반복 실수'],
    drop:['단어 점수 지난주 대비 6점 하락','챕터 테스트 점수 하락, 앞부분 범위 약함'],
    missing:['독해 숙제 2회 연속 미제출','듣기 숙제 녹음 파일 미제출 반복'],
    concept:['to부정사 vs 동명사 구분 개념 부족','5형식 목적보어 이해 부족'],
    behavior:['수업 중 잡담 잦음, 집중 시간 짧음','필기 안 하고 엎드려 있음'],
    positive:['발표 처음으로 자원함','오답노트 스스로 작성해 옴']};
  const NFIND={essay:['서론 topic sentence 없이 시작','문단 연결어 사용이 늘어남'],speaking:['/r/ /l/ 발음 구분 개선 중','말끝 흐림, 자신감 부족'],attitude:['스피킹 영상 마감 2회 지연']};
  const AREA_BY={drop:'word',repeat:'grammar',missing:'reading',concept:'grammar',behavior:'attitude',positive:'word'};
  const ACT_BY={drop:'retest',repeat:'oneone',missing:'extra',concept:'oneone',behavior:'seat',positive:'praise'};
  const NOTE={improved:['재시험 27/30 통과','다음 수업 같은 유형 정답','숙제 제출 재개'],same:['같은 유형 여전히 헷갈림'],worse:['추가 숙제도 미제출','점수 추가 하락']};
  const mk=(st,teacher,created,type,area,result,finding)=>{
    const follow=addDays(created,ri(2,4));
    let res=result;
    if(res===undefined)res=follow<TODAY&&rnd()<0.88?(rnd()<0.62?'improved':rnd()<0.8?'same':'worse'):null;
    db.care.push({id:nid('CR'),sid:st.id,teacher,area,type,finding:finding||pick(FIND[type]),action:ACT_BY[type],action_note:'',follow,result:res,
      result_note:res?pick(NOTE[res]):'',cand:rnd()<0.8,created});
  };
  db.students.forEach((st,i)=>{
    if(st.pattern=='gap'){mk(st,st.homeroom,'2026-09-04','positive','word','improved');return}
    const cnt=ri(1,3);
    for(let j=0;j<cnt;j++){const t=pick(Object.keys(TYPES));mk(st,st.homeroom,addDays('2026-09-01',ri(3,29)),t,AREA_BY[t])}
    if(st.pattern=='worse'){mk(st,st.homeroom,'2026-09-15','missing','reading','worse');mk(st,st.homeroom,'2026-09-22','behavior','attitude','worse')}
    if(i%3==0){const a=pick(['essay','speaking']);mk(st,'N1',addDays('2026-09-01',ri(5,28)),a=='essay'?'repeat':'positive',a,undefined,pick(NFIND[a]))}
  });

  // remedial tickets & logs
  const addLog=(t,date,out,st,fast)=>{
    t.status=out;const c=db.classes.find(x=>x.id==st.cls);const h=+c.start.slice(0,2)+1;
    const pass=out!='done'?'60':fast?'10':rnd()<0.2?'10':rnd()<0.62?'30':'60';
    db.logs.push({id:nid('LG'),ticket:t.id,sid:st.id,task:t.task,date,assistant:pick(['A1','A2']),checkIn:`${h}:0${ri(0,9)}`,
      c20:pass=='10'?null:ri(1,3),c40:pass=='60'?ri(1,3):null,outcome:out,pass,att:out=='done'?pick(['focus','focus','normal']):pick(['normal','distract','distract']),
      extra:pass!='60'&&rnd()<0.5?pick(['E1','E2','E3','E4']):null,extraDone:rnd()<0.7,memo:''});
  };
  db.students.forEach(st=>{
    const ss=db.sessions.filter(s=>s.cls==st.cls&&!s.pending);let forced=0;
    ss.forEach((s,i)=>{
      const tasks=[];const sc=db.scores.find(x=>x.sess==s.id&&x.sid==st.id);
      if(sc&&!sc.passed)tasks.push(['단어 기준 미달',`단어 재시험 (${sc.score}/30)`]);
      db.hw.filter(h=>h.sess==s.id&&h.sid==st.id&&h.status=='X').forEach(h=>tasks.push(['숙제 미완',`${HW[h.item]} 숙제 완료`]));
      tasks.forEach(([reason,task])=>{
        const t={id:nid('TK'),sid:st.id,issuedBy:st.homeroom,reason,task,src:s.date,from:null,status:'open',avail:s.date};
        db.tickets.push(t);
        if(s.date==TODAY)return;
        let out=rnd()<0.85?'done':rnd()<0.5?'partial':'incomplete';
        if(st.pattern=='remedial3'){out='done';if(s.date>='2026-09-01'&&forced<3){out='incomplete';forced++}}
        if(st.pattern=='fastpass')out='done';
        addLog(t,s.date,out,st,st.pattern=='fastpass'&&s.date>='2026-09-01');
        if(out!='done'){
          const nx=ss[i+1];
          const ct={id:nid('TK'),sid:st.id,issuedBy:st.homeroom,reason:t.reason,task:t.task,src:t.src,from:t.id,status:'open',avail:nx?nx.date:addDays(s.date,1)};
          db.tickets.push(ct);
          if(nx&&nx.date<TODAY)addLog(ct,nx.date,'done',st,false);
        }
      });
    });
  });

  // showcase
  const SHC=['주제문이 분명해짐','문장 길이와 연결어가 다양해짐','발음이 또렷해지고 속도가 안정됨','결론 문단 구성이 좋아짐','자기 경험을 구체적으로 표현함'];
  db.students.forEach(st=>['2026-08','2026-09'].forEach(m=>db.showcase.push({id:nid('SH'),sid:st.id,month:m,kind:pick(['essay','speaking']),url:`https://drive.google.com/demo/${st.id}-${m}`,comment:pick(SHC)})));
  addRoleData(db);
  return db;
}

/* ---- 역할별 새 방향용 데이터 (기존 임의 데이터 순서를 바꾸지 않도록 마지막에 추가) ---- */
const WORDS='apple brave cloud dream eager fancy giant habit image jelly knock lemon magic noble ocean pilot quiet river smile tiger umbra vivid whale xenon youth zebra anchor bridge candle desert engine forest garden harbor island jungle kettle ladder mirror needle orange parrot rocket saddle tunnel violin wagon yellow zipper'.split(' ');
// 그 수업 단어 시험 정답지 30개 (데모: 수업 날짜로 단어 목록을 돌림)
function wordKey(sessId){const s=DB.sessions.find(x=>x.id==sessId);const off=s?(+s.date.slice(8,10)+ +s.date.slice(5,7)*3)%WORDS.length:0;return Array.from({length:30},(_,i)=>WORDS[(off+i)%WORDS.length])}
function addRoleData(db){
  // 등록일: 14명은 최근 8주 안에 들어온 신규생
  db.students.forEach((st,i)=>{st.enrolled=i%7==3?addDays('2026-08-17',ri(0,42)):pick(['2025-03-03','2025-09-01','2026-03-02'])});
  db.students.filter(st=>st.enrolled>'2026-08-03').forEach(st=>{
    const e=st.enrolled,gone=new Set(db.tickets.filter(t=>t.sid==st.id&&t.src<e).map(t=>t.id));

let dismissed=new Set();
function careItems(cid){
  const c=CL(cid),S=DB.settings,native=c.type=='native',out=[];
  for(const st of studentsOf(cid)){
    const its=[];
    const add=(rank,code,since,text,act,ex={})=>{const key=st.id+'|'+code;if(!dismissed.has(key))its.push({rank,code,since,text,act,key,sid:st.id,...ex})};
    const recs=DB.care.filter(r=>r.sid==st.id&&(native?r.teacher==c.teacher:US(r.teacher).role=='teacher'));
    recs.filter(r=>!r.result&&r.follow<=TODAY).forEach(r=>add(1,'res'+r.id,r.follow,`${AREAS[r.area]} 결과 확인 — "${r.finding}" (${ACTIONS[r.action]})`,'result',{rid:r.id}));
    if(!native){
      const sc=scoresOf(st.id),last=sc.at(-1);
      if(sc.length>=4){const p=sc.slice(-4,-1),a=avg(p);if(last.score<=a*(1-S.dropPct/100))add(2,'drop',last.date,`단어 ${last.score}/30 · 최근 3회 평균 ${a.toFixed(1)} 대비 ${Math.round((1-last.score/a)*100)}% 하락`,'care',{preset:{area:'word',type:'drop'}})}
      if(sc.length>=2&&sc.slice(-2).every(x=>x.score<S.pass))add(2,'fail2',sc.at(-2).date,`단어 통과 기준(${S.pass}개) 미만 2회 연속 · ${sc.slice(-2).map(x=>x.score).join(' → ')}`,'care',{preset:{area:'word',type:'repeat'}});
      for(const it of Object.keys(HW)){const hs=DB.hw.filter(h=>h.sid==st.id&&h.item==it).sort(byDate).slice(-2);
        if(hs.length==2&&hs.every(h=>h.status=='X'))add(2,'hw'+it,hs[0].date,`${HW[it]} 숙제 2회 연속 미제출`,'care',{preset:{area:it=='essay'?'essay':it,type:'missing'}})}
      const at=DB.att.filter(a=>a.sid==st.id).sort(byDate).at(-1);
      if(at&&at.status=='absent')add(2,'abs',at.date,`${md(at.date)} 결석 후 첫 수업 · 보충 여부 확인`,'care',{preset:{area:'attitude',type:'behavior'}});
      const lg=logsOf(st.id),ll=lg.at(-1);
      if(ll&&ll.outcome=='incomplete')add(2,'rinc',ll.date,`나머지 미완료 귀가 (${md(ll.date)}) · 이월 과제 확인`,'care',{preset:{area:'attitude',type:'missing'}});
      if(termInc(st.id)==2)add(2,'inc2',ll?ll.date:TODAY,'나머지 미완료 누적 2회 · 케어 기록 초안이 준비됨','care',{preset:{area:'attitude',type:'missing',finding:'나머지 학습 미완료 2회 누적 (자동 초안)'}});
      const fast=lg.filter(l=>l.date>addDays(TODAY,-28)&&l.pass=='10'&&l.outcome=='done').length;
      if(fast>=S.fastPass)add(2,'fast',addDays(TODAY,-28),`나머지 10분 내 통과 최근 4주 ${fast}회 · 집에서 준비하는 습관 확인`,'care',{preset:{area:'attitude',type:'missing'}});
      if(sc.length>=3){const pm=Math.max(...sc.slice(0,-1).map(x=>x.score));
        if(last.score>pm)add(3,'best',last.date,`개인 최고점 ${last.score}/30 달성`,'praise');
        else if(sc.slice(-3).every((x,i,a)=>!i||x.score>a[i-1].score))add(3,'rise3',last.date,`단어 3회 연속 상승 · ${sc.slice(-3).map(x=>x.score).join(' → ')}`,'praise')}
    }
    const lc=recs.map(r=>r.created).sort().at(-1);
    if(!lc||diff(TODAY,lc)>=S.gapDays)add(4,'gap',lc||'2000-01-01',lc?`최근 ${diff(TODAY,lc)}일간 케어 기록 없음 · 이번 주 관찰 1건`:'케어 기록 없음 · 이번 주 관찰 1건','care');
    if(its.length){its.sort((a,b)=>a.rank-b.rank||(a.since<b.since?-1:1));out.push({st,top:its[0],rest:its.slice(1)})}
  }
  out.sort((a,b)=>a.top.rank-b.top.rank||(a.top.since<b.top.since?-1:1));
  return out;
}

function riskOf(st){

  const w=DB.care.filter(x=>x.sid==st.id&&x.result=='worse').length;if(w>=S.worseRisk)r.push(['악화 '+w+'건','r']);

/* ============ 역할별 새 방향: 퇴원 위험 · 신규생 적응 · 조교 인수인계 ============ */
// 퇴원 위험 점수 (0~100). 최근 4주 신호를 더한다. 기준은 관리·설정에서 조정.
function churnOf(st){
  const S=DB.settings,from=addDays(TODAY,-28),R=[];let sc=0;
  const add=(pts,label,c='r')=>{sc+=pts;R.push([label,c])};
  const at=DB.att.filter(a=>a.sid==st.id&&a.date>from);
  const ab=at.filter(a=>a.status=='absent').length;if(ab)add(ab>=2?Math.min(60,ab*25):15,`결석 ${ab}회`); // 한 번은 흔하지만 두 번부터는 강한 신호
  const lt=at.filter(a=>a.status=='late').length;if(lt>=2)add(5,`지각 ${lt}회`,'a');
  const hw=DB.hw.filter(h=>h.sid==st.id&&h.date>from),hx=hw.length?hw.filter(h=>h.status=='X').length/hw.length:0;
  if(hx>=.15)add(15,`숙제 미제출 ${Math.round(hx*100)}%`);
  const sc4=scoresOf(st.id),a=avg(sc4.filter(x=>x.date>from)),b=avg(sc4.filter(x=>x.date<=from&&x.date>addDays(TODAY,-56)));
  if(a&&b&&a<=b*.9)add(20,`단어 평균 ${Math.round((1-a/b)*100)}%↓`,'a');
  const inc=termInc(st.id);if(inc>=2)add(15,`나머지 미완 ${inc}회`);
  const lc=lastCare(st.id),g=lc?diff(TODAY,lc):diff(TODAY,st.enrolled||TODAY);if(g>=21)add(10,`관찰 공백 ${g}일`,'n');
  const w=DB.care.filter(r=>r.sid==st.id&&r.result=='worse').length;if(w)add(10,`악화 ${w}건`);
  const ad=adaptOf(st);if(ad&&R.length)add(10,`신규 ${ad.week}주차`,'b');
  const score=Math.min(100,sc);
  return{score,reasons:R,level:score>=S.churnHigh?'high':score>=S.churnWatch?'watch':'low'};
}

// 신규생 적응: 등록 후 newWeeks 주 안이면 주차와 지표, 아니면 null
function adaptOf(st){

  ${DTAB=='brief'?dashBrief(studs,hcls):DTAB=='risk'?dashRisk(risk):DTAB=='progress'?dashProgress(hcls,delayed):DTAB=='records'?dashRecords(rows):dashOverview(set,studs,start,careP,teachers)}`;
}
// 원장 아침 브리핑: 퇴원 위험 · 신규생 적응 · 반별 상태 · 선생님별 놓치는 것 · 최근 퇴원 · 어제 이후 생긴 일
function dashBrief(studs,hcls){
  const from=addDays(TODAY,-28),y=addDays(TODAY,-1);
  const ch=studs.map(s=>({s,c:churnOf(s)})).filter(x=>x.c.level!='low').sort((a,b)=>b.c.score-a.c.score);
  const nw=studs.map(s=>({s,a:adaptOf(s)})).filter(x=>x.a).sort((a,b)=>(a.a.status[1]=='g')-(b.a.status[1]=='g')||a.a.week-b.a.week);
  const rate=(xs,f)=>xs.length?xs.filter(f).length/xs.length:null;
  const heat=(v,g,o)=>v==null?'background:var(--surf);color:var(--faint)':v>=g?'background:#d3efe5;color:#0d5640':v>=o?'background:var(--amber-soft);color:#a26411':'background:var(--red-soft);color:#b83f2c';
  const crows=hcls.filter(c=>!FILT.cls||c.id==FILT.cls).map(c=>{const ids=new Set(studentsOf(c.id).map(s=>s.id)),p=progressOf(c);
    return{c,v:[[rate(DB.att.filter(a=>ids.has(a.sid)&&a.date>from),a=>a.status!='absent'),.95,.9],[rate(DB.hw.filter(h=>ids.has(h.sid)&&h.date>from),h=>h.status=='O'),.85,.75],
      [rate(DB.scores.filter(x=>ids.has(x.sid)&&x.date>from),x=>isPassScore(x.score)),.65,.5],[rate(DB.logs.filter(l=>ids.has(l.sid)&&l.date>from),l=>l.outcome=='done'),.85,.7],[p.er?Math.min(1,p.pr/p.er):null,.95,.85]]}});
  const tea=DB.users.filter(u=>u.role=='teacher'&&(!FILT.teacher||u.id==FILT.teacher)).map(t=>{const ss=studs.filter(s=>s.homeroom==t.id);
    const m=[['결과 미입력',DB.care.filter(r=>r.teacher==t.id&&!r.result&&r.follow<=TODAY).length],
      ['퇴원 위험 미대응',ss.filter(s=>churnOf(s).level=='high'&&['new',undefined].includes(DB.riskStatus[s.id]?.status)).length],
      ['신규생 관찰 없음',ss.filter(s=>adaptOf(s)?.care===0).length],
      [`기록 공백 ${DB.settings.gapDays}일`,ss.filter(s=>{const l=lastCare(s.id,t.id);return !l||diff(TODAY,l)>=DB.settings.gapDays}).length],
      ['이번 학기 퇴원',DB.withdrawals.filter(w=>w.teacher==t.id).length]];
    return{t,m,sum:m.slice(0,4).reduce((a,x)=>a+x[1],0)}}).sort((a,b)=>b.sum-a.sum);
  const ids=new Set(studs.map(s=>s.id));
  const feed=[...DB.att.filter(a=>a.date>=y&&a.status=='absent'&&ids.has(a.sid)).map(a=>({d:a.date,c:'r',t:`${ST(a.sid).name} 결석`,sid:a.sid})),
    ...DB.logs.filter(l=>l.date>=y&&l.outcome!='done'&&ids.has(l.sid)).map(l=>({d:l.date,c:'a',t:`${ST(l.sid).name} 나머지 ${OUTCOME[l.outcome]} · ${l.task}`,sid:l.sid})),
    ...DB.withdrawals.filter(w=>w.date>=addDays(TODAY,-7)).map(w=>({d:w.date,c:'n',t:`${w.name} 퇴원 (${w.reason})`})),
    ...DB.suggestions.filter(x=>x.status=='pending'&&ids.has(x.sid)).map(x=>({d:x.date,c:'b',t:`${ST(x.sid).name} 나머지 제안 확정 대기`,sid:x.sid}))].sort((a,b)=>a.d<b.d?1:-1);
  const wd=DB.withdrawals,withSig=wd.filter(w=>w.signals.length).length;
  return `<div class="grid g2 mb">
    <div class="card"><div class="chead"><h3>퇴원 위험</h3><span class="bd r">높음 ${ch.filter(x=>x.c.level=='high').length}</span><span class="bd a">주의 ${ch.filter(x=>x.c.level=='watch').length}</span></div>
      ${ch.length?`<div class="tblw"><table class="t"><tr><th>학생</th><th>점수</th><th>신호</th><th>처리</th></tr>${ch.slice(0,10).map(({s,c})=>`<tr><td><a onclick="nav('timeline',{sid:'${s.id}'})"><b>${esc(s.name)}</b></a><div class="small muted">${esc(CL(s.cls).name)} · ${US(s.homeroom).name}</div></td>
        <td><span class="bd ${CHURN[c.level][1]}">${c.score}</span></td><td>${c.reasons.slice(0,3).map(([t,k])=>`<span class="bd ${k}">${t}</span>`).join(' ')}</td>
        <td><select data-nd style="width:auto;padding:6px 28px 6px 10px;font-size:12px" onchange="setRisk('${s.id}',this.value);render()">${Object.entries(RSTAT).map(([k,[l]])=>`<option value="${k}" ${(DB.riskStatus[s.id]?.status||'new')==k?'selected':''}>${l}</option>`).join('')}</select></td></tr>`).join('')}</table></div>
        ${ch.length>10?`<div class="small muted" style="margin-top:8px">외 ${ch.length-10}명 (점수 낮은 순으로 생략)</div>`:''}`:'<div class="empty">퇴원 위험 신호가 있는 학생이 없습니다</div>'}</div>
    <div class="card"><div class="chead"><h3>신규생 적응</h3><span class="small muted">등록 ${DB.settings.newWeeks}주 이내 ${nw.length}명</span></div>
      ${nw.length?nw.slice(0,8).map(({s,a})=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="row" style="flex-wrap:nowrap"><a onclick="nav('timeline',{sid:'${s.id}'})"><b>${esc(s.name)}</b></a><span class="small muted sp">${esc(CL(s.cls).name)} · ${US(s.homeroom).name}</span><span class="bd ${a.status[1]}">${a.status[0]}</span></div>
        <div class="row" style="flex-wrap:nowrap;margin-top:6px;gap:8px"><span class="small b" style="width:44px">${a.week}주차</span><div class="sp">${meter(a.week/DB.settings.newWeeks,COL.b)}</div></div>
        <div class="small muted" style="margin-top:4px">출석 ${pct(a.att)} · 숙제 ${pct(a.hw)} · 단어 통과 ${pct(a.pass)} · 담임 관찰 ${a.care}건</div></div>`).join('')+(nw.length>8?`<div class="small muted" style="margin-top:8px">외 ${nw.length-8}명 (주의·관찰 필요 먼저 표시)</div>`:''):'<div class="empty">최근 등록한 학생이 없습니다</div>'}</div>
  </div>
  <div class="grid g2 mb">
    <div class="card"><div class="chead"><h3>반별 상태</h3><span class="small muted">최근 4주 · 초록 좋음 / 주황 주의 / 빨강 확인</span></div>
      <div class="tblw"><table class="t"><tr><th>반</th><th>출석</th><th>숙제</th><th>단어 통과</th><th>나머지 완료</th><th>진도</th></tr>
      ${crows.map(({c,v})=>`<tr><td><b>${esc(c.name)}</b><div class="small muted">${dayLabel(c)} ${c.start} · ${US(c.teacher).name}</div></td>${v.map(([x,g,o])=>`<td style="padding:6px"><div style="${heat(x,g,o)};border-radius:10px;padding:8px;text-align:center;font-weight:700;font-size:12.5px">${pct(x)}</div></td>`).join('')}</tr>`).join('')}</table></div></div>
    <div class="card"><div class="chead"><h3>선생님별 놓치고 있는 것</h3><span class="small muted">원장만 보는 화면 · 건수 경쟁이 아니라 빠진 곳 찾기</span></div>
      ${tea.map(({t,m,sum})=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div class="row">${avatar(t.name)}<b class="sp">${esc(t.name)} 선생님</b>${sum?`<span class="bd ${sum>=8?'r':'a'}">놓친 것 ${sum}</span>`:'<span class="bd g">빠진 곳 없음</span>'}</div>
        <div class="row" style="gap:6px;margin-top:8px">${m.map(([l,n],i)=>`<span class="bd ${n==0?'n':i==4?'n':i==1?'r':'a'}">${l} ${n}</span>`).join('')}</div></div>`).join('')}</div>
  </div>
  <div class="grid g2">
    <div class="card"><div class="chead"><h3>이번 학기 퇴원</h3><span class="bd n">${wd.length}명</span></div>
      <div class="small" style="margin-bottom:10px">${wd.length} 명 중 <b style="color:var(--red)">${withSig}명</b>은 그만두기 전에 신호가 있었습니다.</div>
      ${wd.map(w=>`<div class="task" style="flex-wrap:wrap"><b>${esc(w.name)}</b><span class="small muted">${w.grade} · ${US(w.teacher).name} · ${md(w.date)} · 등록 ${w.weeks}주</span><span class="sp"></span><span class="bd n">${esc(w.reason)}</span>${w.signals.map(x=>`<span class="bd r">${esc(x)}</span>`).join('')}</div>`).join('')}</div>
    <div class="card"><div class="chead"><h3>어제 이후 새로 생긴 일</h3><span class="small muted">${md(y)} ~ 오늘</span></div>
      ${feed.length?feed.slice(0,12).map(e=>`<div class="todo" ${e.sid?`onclick="nav('timeline',{sid:'${e.sid}'})"`:''} style="padding:9px 8px"><span class="bd ${e.c}" style="min-width:44px;justify-content:center">${md(e.d)}</span><span class="sp">${esc(e.t)}</span>${e.sid?'<span class="chev">›</span>':''}</div>`).join(''):'<div class="empty">새로 생긴 일이 없습니다</div>'}</div>
  </div>`;
}
function dashOverview(set,studs,start,careP,teachers){
  const weeks=[];for(let i=7;i>=0;i--)weeks.push(addDays(TODAY,-7*i-((D(TODAY).getDay()+6)%7)));
  const sc=DB.scores.filter(s=>set.has(s.sid));
  const wpts=weeks.map(w=>{const v=avg(sc.filter(s=>s.date>=w&&s.date<addDays(w,7)));return v==null?null:{l:md(w),v:+v.toFixed(1)}}).filter(Boolean);
  const ps=sc.filter(s=>s.date>=start),pr=ps.length?ps.filter(s=>s.passed).length/ps.length:0;
  const resSeg=[{l:'개선',v:careP.filter(r=>r.result=='improved').length,c:COL.g},{l:'유지',v:careP.filter(r=>r.result=='same').length,c:COL.a},{l:'악화',v:careP.filter(r=>r.result=='worse').length,c:COL.r},{l:'미입력/대기',v:careP.filter(r=>!r.result).length,c:COL.n}];
  const days14=[];for(let i=13;i>=0;i--)days14.push(addDays(TODAY,-i));
  const remDays=days14.map(d=>{const L=DB.logs.filter(l=>l.date==d&&set.has(l.sid));return {l:md(d),stack:[{v:L.filter(l=>l.outcome=='done').length,c:COL.g},{v:L.filter(l=>l.outcome=='partial').length,c:COL.a},{v:L.filter(l=>l.outcome=='incomplete').length,c:COL.r}]}}).filter(x=>x.stack.some(s=>s.v));
  const calCounts={};DB.care.filter(r=>set.has(r.sid)).forEach(r=>calCounts[r.created]=(calCounts[r.created]||0)+1);
  const tStats=teachers.filter(t=>!FILT.teacher||t.id==FILT.teacher).map(t=>{const ss=studs.filter(s=>s.homeroom==t.id);const cr=DB.care.filter(r=>r.teacher==t.id&&r.created>=start&&set.has(r.sid));const due=cr.filter(r=>r.follow<=TODAY);
    return {t,rate:due.length?Math.round(due.filter(r=>r.result).length/due.length*100):100,pend:cr.filter(r=>!r.result&&r.follow<=TODAY).length,gap:ss.filter(s=>{const l=lastCare(s.id,t.id);return !l||diff(TODAY,l)>=DB.settings.gapDays}).length}});
  const flowN={f:careP.length,a:careP.filter(r=>r.action).length,r:careP.filter(r=>r.result).length,i:careP.filter(r=>r.result=='improved').length};
  return `<div class="grid g2 mb">
    <div class="card"><div class="chead"><h3>단어 점수 주간 평균</h3><span class="bd g">통과율 ${pct(pr)}</span></div>
      ${lineChart(wpts,{min:18,max:30,ref:DB.settings.pass,refLabel:`통과 기준 ${DB.settings.pass}`})}</div>
    <div class="card"><div class="chead"><h3>케어 기록 흐름</h3><span class="small muted">발견 → 조치 → 결과</span></div>
      <div class="flowbig"><div class="nd"><div class="v">${flowN.f}</div><div class="t">발견</div></div><span class="arw">›</span><div class="nd"><div class="v">${flowN.a}</div><div class="t">조치</div></div><span class="arw">›</span><div class="nd"><div class="v">${flowN.r}</div><div class="t">결과 입력</div></div><span class="arw">›</span><div class="nd" style="background:var(--acc-soft)"><div class="v" style="color:var(--acc-ink)">${flowN.i}</div><div class="t">개선</div></div></div>
      <div class="row" style="margin-top:16px;gap:18px;flex-wrap:nowrap">${donut(resSeg,{size:112,center:careP.length,sub:'케어 기록'})}<div class="sp">${legend(resSeg)}</div></div></div>
  </div>
  <div class="grid g3">
    <div class="card"><div class="chead"><h3>나머지 결과 · 14일</h3></div>${remDays.length?bars(remDays):'<div class="empty">기록 없음</div>'}
      <div class="legend" style="margin-top:10px"><span><i style="background:${COL.g}"></i>완료</span><span><i style="background:${COL.a}"></i>부분</span><span><i style="background:${COL.r}"></i>미완</span></div></div>
    <div class="card"><div class="chead"><h3>교사별 결과 입력률</h3></div>
      ${bars(tStats.map(x=>({l:x.t.name,v:x.rate,c:x.rate<80?COL.a:COL.g})),{max:100,fmtv:v=>v+'%'})}
      <div class="small muted" style="margin-top:10px">확인일 지난 기록 중 결과를 입력한 비율 · 목표 80%</div></div>
    <div class="card"><div class="chead"><h3>${+CALM.slice(5)}월 기록 캘린더</h3><button class="btn icon ghost" onclick="CALM=prevMonth(CALM);render()">‹</button><button class="btn icon ghost" ${CALM>=TODAY.slice(0,7)?'disabled':''} onclick="CALM=nextMonth(CALM);render()">›</button></div>${heatCal(CALM,calCounts)}
      <div class="legend" style="margin-top:10px"><span><i style="background:var(--surf);border:1px solid var(--line)"></i>0</span><span><i style="background:#d3efe5"></i>1–2</span><span><i style="background:#93d7c1"></i>3–5</span><span><i style="background:var(--acc)"></i>6+</span></div></div>
  </div>`;
}
function dashRisk(risk){
  return `<div class="card"><div class="chead"><h3>위험 학생</h3><span class="bd r">${risk.length}명</span><span class="small muted">기준: 나머지 미완 ${DB.settings.incompleteRisk}회 · 4주 평균 ${DB.settings.riskDropPct}%↓ · 악화 ${DB.settings.worseRisk}건 · 공백 ${DB.settings.riskGapDays}일</span></div>
    ${risk.length?`<div class="tblw"><table class="t"><tr><th>학생</th><th>반 · 담임</th><th>사유</th><th>단어 추이</th></tr>${risk.map(({s,r})=>`<tr class="click" onclick="nav('timeline',{sid:'${s.id}'})"><td><div class="row" style="gap:10px;flex-wrap:nowrap">${avatar(s.name)}<div><b>${esc(s.name)}</b><div class="small muted">${s.grade} · ${s.school}</div></div></div></td><td class="small">${esc(CL(s.cls).name)}<div class="muted">${US(s.homeroom).name}</div></td><td>${r.map(([t,c])=>`<span class="bd ${c}">${t}</span>`).join(' ')}</td><td>${spark(scoresOf(s.id).slice(-10).map(x=>x.score),{ref:DB.settings.pass})}</td></tr>`).join('')}</table></div>`:'<div class="empty">위험 학생 없음</div>'}</div>`;
}
function dashProgress(hcls,delayed){
  return `<div class="grid g2"><div class="card"><div class="chead"><h3>반별 진도</h3><span class="legend"><span><i style="background:var(--acc)"></i>진도</span><span><i style="background:#b9c3c8"></i>경과</span></span></div>

      <div class="row" style="gap:8px;margin-top:6px;flex-wrap:nowrap"><div class="sp">${meter(p.pr,p.delayed?COL.r:COL.g)}</div><span class="small b" style="width:40px;text-align:right">${pct(p.pr)}</span></div>
      <div class="row" style="gap:8px;margin-top:4px;flex-wrap:nowrap"><div class="sp">${meter(p.er,'#b9c3c8')}</div><span class="small muted" style="width:40px;text-align:right">${pct(p.er)}</span></div></div>`}).join('')}</div>
    <div class="card" style="align-self:start"><div class="chead"><h3>지연 판정 방법</h3></div>
      ${delayed.length?delayed.map(c=>{const p=progressOf(c);return `<div class="formula" style="margin-bottom:10px"><b>${esc(c.name)}</b><br>진행 ${p.done} ÷ 계획 ${p.planned} = <b>${pct(p.pr)}</b><br>경과 ${p.el} ÷ 전체 ${p.total} = <b>${pct(p.er)}</b><br>차이 <span class="bad">${Math.round((p.er-p.pr)*100)}%p ≥ 10%p → 지연</span></div>`}).join(''):'<div class="empty">지연된 반이 없습니다</div>'}</div></div>`;
}
function dashRecords(rows){

function openDrill(kind){
  const d=window._drill,go=sid=>`closeModal();nav('timeline',{sid:'${sid}'})`;

    :kind=='gap'?d.gap.map(s=>{const l=lastCare(s.id);return `<tr class="click" onclick="${go(s.id)}"><td><b>${esc(s.name)}</b></td><td class="small">${esc(CL(s.cls).name)}</td><td class="small">${US(s.homeroom).name}</td><td class="small">${l?'마지막 '+md(l):'기록 없음'}</td></tr>`}).join('')
    :d.sugg.map(x=>`<tr class="click" onclick="${go(x.sid)}"><td><b>${esc(stLabel(ST(x.sid)))}</b></td><td class="small">${esc(x.task)}</td><td class="small">${US(ST(x.sid).homeroom).name}</td><td class="small">${esc(x.reason)}</td></tr>`).join('');

}
const csv=rows=>rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
function dl(name,text,type='text/csv;charset=utf-8'){const b=new Blob([type.startsWith('text/csv')?'﻿'+text:text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()}
function dlRows(){dl(`기록목록_${TODAY}.csv`,csv([['날짜','학생','학년','학교','반','담임','구분','내용','결과','작성'],...window._rows.map(r=>{const s=ST(r.sid);return[r.date,s.name,s.grade,s.school,CL(s.cls).name,US(s.homeroom).name,r.kind,r.detail,r.res,r.by]})]));toast('CSV(엑셀) 다운로드')}

  // 결과 입력(확인)은 따로 묶고, 오늘 챙길 학생 5칸은 경고·칭찬·공백만

  const remN=new Set([...openT,...tLogs].map(x=>x.sid)).size,remDone=tLogs.filter(l=>l.outcome=='done').length;

    ${stat(ring(sugg.length?0:1,{size:52,color:COL.a,center:''}),sugg.length+'건','나머지 제안 확정 대기')}
  </div>`}

  <div class="grid g2">
   <div class="stack">
    <div class="card"><div class="chead"><h3>오늘 챙길 학생</h3>${[2,3,4].map(r=>`<span class="bd ${RANK[r][1]}">${RANK[r][0]} ${cnt[r]}</span>`).join('')}</div>
      ${top.length?top.map(({st,top:t,rest})=>`<div class="ci"><div class="rk">${rankBadge(t.rank)}</div>${avatar(st.name)}
        <div class="main2"><div class="nm"><a onclick="nav('timeline',{sid:'${st.id}'})">${esc(st.name)}</a></div><div class="why" title="${esc(t.text)}">${esc(t.text)}</div>${rest.length?`<div class="more" title="${esc(rest.map(x=>x.text).join(' / '))}">+ ${rest.map(x=>esc(x.text.split(' · ')[0].split(' — ')[0])).join(' / ')}</div>`:''}</div>
        <div class="acts">${canW?actBtn(t):''}${canW?`<button class="btn icon ghost" title="확인함 (오늘 목록에서 빼기)" onclick="dismiss('${t.key}')">${ic('check',16)}</button>`:''}</div></div>`).join(''):'<div class="empty">오늘 챙길 학생이 없습니다 👍</div>'}
      <div class="row" style="margin-top:8px">${items.length>top.length?`<span class="small muted">외 ${items.length-top.length}명은 다음 순위</span>`:''}<span class="sp"></span>
      ${(()=>{const ids=new Set(studs.map(s=>s.id)),n=[...dismissed].filter(k=>ids.has(k.split('|')[0])).length;return n?`<button class="btn sm ghost" onclick="unhide('${c.id}')">숨긴 항목 ${n}개 다시 보기</button>`:''})()}</div></div>

    <div class="card"><div class="chead"><h3>반 학생 ${studs.length}명</h3>${canW?`<button class="btn sm pri" onclick="openCare(null)">${ic('plus',14)}케어 기록</button>`:''}</div>
      <div class="tblw"><table class="t"><tr><th>학생</th>${native?'<th>9월 대표작</th><th>10월 대표작</th>':'<th>단어 추이</th><th>숙제 (4주)</th>'}<th>케어</th><th></th></tr>
      ${studs.map(s=>{const sc=scoresOf(s.id);const hw=DB.hw.filter(h=>h.sid==s.id&&h.date>addDays(TODAY,-28));const hr=hw.length?hw.filter(h=>h.status=='O').length/hw.length:0;const nc=DB.care.filter(r=>r.sid==s.id).length;
        const sh=m=>{const x=DB.showcase.find(z=>z.sid==s.id&&z.month==m);return x?`<span class="bd ${x.kind=='essay'?'b':'g'}">${x.kind=='essay'?'에세이':'스피킹'}</span>`:'<span class="bd n">미선택</span>'};
        return `<tr><td><a onclick="nav('timeline',{sid:'${s.id}'})"><b>${esc(s.name)}</b></a>${newTag(s)} <span class="small muted">${s.school}</span></td>
        ${native?`<td>${sh('2026-09')}</td><td>${sh('2026-10')}</td>`:`<td><div class="row" style="flex-wrap:nowrap;gap:8px">${spark(sc.slice(-10).map(x=>x.score),{ref:DB.settings.pass})}<span class="small b">${sc.at(-1)?.score??'–'}</span></div></td><td><div class="row" style="flex-wrap:nowrap;gap:8px">${meter(hr,hr<.75?COL.a:COL.g)}<span class="small">${pct(hr)}</span></div></td>`}
        <td class="small">${nc}건</td><td style="white-space:nowrap;text-align:right">${canW?`<button class="btn sm" onclick="openCare('${s.id}')">케어</button> `:''}${(canW||ME.role=='director')&&!native?`<button class="btn sm" onclick="openTicket('${s.id}')">티켓</button>`:''}${canW&&!native?` <button class="btn sm" onclick="openNote('${s.id}')">당부</button>`:''}</td></tr>`}).join('')}</table></div></div>
   </div>

   <div class="stack">
    ${churn.length?`<div class="card" style="border-color:var(--red)"><div class="chead"><h3>그만둘 수 있는 신호</h3><span class="bd r">${churn.length}명</span></div>
      ${churn.map(({s,c})=>{const rs=DB.riskStatus[s.id]?.status;return `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="row" style="flex-wrap:nowrap"><a onclick="nav('timeline',{sid:'${s.id}'})"><b>${esc(s.name)}</b></a>${newTag(s)}<span class="sp"></span>${rs&&rs!='new'?`<span class="bd ${RSTAT[rs][1]}">${RSTAT[rs][0]}</span>`:''}<span class="bd ${CHURN[c.level][1]}">${CHURN[c.level][0]} ${c.score}</span></div>
        <div class="row" style="gap:6px;margin-top:6px">${c.reasons.map(([t,k])=>`<span class="bd ${k}">${t}</span>`).join('')}</div>
        ${canW?`<div class="row" style="margin-top:8px;gap:6px"><button class="btn sm pri" onclick='openCare("${s.id}",{area:"attitude",type:"${c.reasons[0][0].startsWith('숙제')?'missing':c.reasons[0][0].startsWith('단어')?'drop':'behavior'}",action:"parent"})'>챙기기 기록</button><button class="btn sm" onclick="openConsult('${s.id}')">상담 준비</button><button class="btn sm" onclick="openNote('${s.id}')">조교 당부</button></div>`:''}</div>`}).join('')}</div>`:''}
    <div class="card"><div class="chead"><h3>결과 입력 대기</h3><span class="bd b">${results.length}건</span></div>
      ${results.length?results.map(r=>{const rec=DB.care.find(x=>x.id==r.rid);return `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="row" style="flex-wrap:nowrap"><b>${esc(r.st.name)}</b><span class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(rec.finding)}">${AREAS[rec.area]} · ${esc(rec.finding)}</span></div>
        <div class="row" style="margin-top:8px;flex-wrap:nowrap"><span class="small muted sp">${ACTIONS[rec.action]} · ${md(rec.follow)} 확인</span>${canW?`<div class="seg">${Object.entries(RESULTS).map(([k,l],i)=>`<button onclick="quickResult('${rec.id}','${k}')">${l}</button>`).join('')}</div><button class="btn sm ghost" onclick="openResult('${rec.id}')">자세히</button>`:''}</div></div>`}).join('')
        :'<div class="empty">밀린 결과 입력이 없습니다</div>'}</div>
    ${sugg.length?`<div class="card" style="border-color:var(--amber)"><div class="chead"><h3>나머지 제안 · 확정 필요</h3><span class="bd a">${sugg.length}건</span></div>
      <div class="small muted" style="margin-bottom:8px">조교 입력에서 자동 제안됨. 확정해야 강당 명단에 올라갑니다.</div>
      ${sugg.map(s=>`<label class="task" style="cursor:pointer"><input type="checkbox" ${s.sel?'checked':''} onchange="sugSel('${s.id}',this.checked)"> <b>${esc(stLabel(ST(s.sid)))}</b> ${esc(s.task)} <span class="sp"></span><span class="bd ${s.def?'r':'a'}">${esc(s.reason)}</span></label>`).join('')}
      ${ME.role=='teacher'?`<div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" onclick="confirmSug('${c.id}',false)">모두 보류</button><button class="btn pri" onclick="confirmSug('${c.id}',true)">선택 확정 발행</button></div>`:''}</div>`:''}

      ${openT.length?`<div class="small muted" style="margin-top:10px">대기: ${[...new Set(openT.map(t=>ST(t.sid).name))].join(', ')}</div>`:''}`:'<div class="empty">오늘 나머지 대상이 없습니다</div>'}</div>
    <div class="card flat"><div class="small muted b" style="margin-bottom:6px">반 정보</div><div class="small">${US(c.teacher).name} · ${c.level} · ${c.textbook}</div>
      <div class="formula" style="margin-top:10px;background:#fff">진도 ${p.done}/${p.planned}회 = <b>${pct(p.pr)}</b> · 경과 ${p.el}/${p.total}일 = <b>${pct(p.er)}</b>${p.delayed?` · <span class="bad">지연 ${Math.round((p.er-p.pr)*100)}%p</span>`:''}</div></div>`}
   </div>
  </div>`;
}
function openNote(sid){
  M={kind:'note',sid,text:''};
  showModal(()=>`<h3>조교 당부 · ${esc(ST(M.sid).name)}</h3><div class="small muted" style="margin-top:4px">다음에 출근하는 조교 화면 맨 위와 학생 카드에 보입니다. 성적·상담 내용은 쓰지 마세요.</div>
    <div class="chips" style="margin-top:14px">${['앞자리에 앉혀 주세요','재시험은 꼭 통과하고 보내 주세요','칭찬을 많이 해 주세요','부모님 픽업 시간 확인해 주세요'].map(t=>`<button class="chip" onclick="M.text='${t}';rm()">${t}</button>`).join('')}</div>
    <textarea id="nt" rows="3" style="margin-top:12px" oninput="M.text=this.value" placeholder="직접 입력">${esc(M.text)}</textarea>
    <div class="mfoot"><button class="btn" onclick="closeModal()">취소</button><button class="btn pri" onclick="saveNote()">남기기</button></div>`);
}
function saveNote(){if(!M.text.trim())return toast('당부 내용을 입력해 주세요',1);DB.notes.push({id:nid('NT'),sid:M.sid,from:ME.id,text:M.text.trim(),created:TODAY});DIRTY=true;closeModal();toast('조교 당부를 남겼습니다');render()}
function quickResult(rid,res){if(res=='worse'&&!confirm('결과를 "악화"로 저장할까요? 원장 위험 학생 판단에 반영됩니다.'))return;const r=DB.care.find(x=>x.id==rid);r.result=res;DIRTY=true;toast(`결과 저장: ${RESULTS[res]}`);render()}
function actBtn(t){
  if(t.act=='result')return `<button class="btn sm pri" onclick="openResult('${t.rid}')">결과 입력</button>`;
  const pre=JSON.stringify({...(t.preset||{}),...(t.act=='praise'?{type:'positive',action:'praise',area:'word'}:{}),dkey:t.key}).replace(/"/g,'&quot;');
  return `<button class="btn sm pri" onclick='openCare("${t.sid}",${pre})'>${t.act=='praise'?'칭찬 기록':t.rank==4?'관찰 기록':'케어 기록'}</button>`;
}
function dismiss(k){dismissed.add(k);toast('오늘 목록에서 제외');render()}
function sugSel(id,v){DB.suggestions.find(s=>s.id==id).sel=v}
function confirmSug(cid,issue){
  if(!issue){const n=DB.suggestions.filter(x=>x.cls==cid&&x.status=='pending').length;if(!confirm(`제안 ${n}건을 모두 보류할까요? 되돌릴 수 없습니다.`))return}
  DIRTY=true;
  let n=0;DB.suggestions.filter(x=>x.cls==cid&&x.status=='pending').forEach(s=>{
    if(issue&&s.sel){DB.tickets.push({id:nid('TK'),sid:s.sid,issuedBy:ME.id,reason:s.reason,task:s.task,src:s.date,from:null,status:'open',avail:TODAY});s.status='issued';n++}else s.status='dismissed'});
  toast(issue?`나머지 티켓 ${n}건 발행 · 강당 명단에 추가됨`:'제안 보류');render();
}

/* ============ modals ============ */
let M={},MF=null;
function showModal(fn){MF=fn;rm()}
function rm(){$('#modal').innerHTML=MF?`<div class="mbg" onclick="if(event.target==this)tryClose()"><div class="modal">${MF()}</div></div>`:''}
function closeModal(){MF=null;rm()}
const careSnap=()=>JSON.stringify([M.area,M.type,(M.finding||'').trim(),M.action]);
function modalDirty(){return M.kind=='care'&&careSnap()!==M._init}
function tryClose(){if(modalDirty()&&!confirm('작성 중인 내용이 사라집니다. 닫을까요?'))return;closeModal()}
function chips(list,cur,key){return `<div class="chips">${list.map(([v,l])=>`<button class="chip ${cur==v?'on':''}" onclick="M.${key}='${v}';rm()">${l}</button>`).join('')}</div>`}

function openCare(sid,pre={}){
  if(ME.role=='director'||ME.role=='assistant')return toast('케어 기록은 교사만 입력합니다',1);
  M={kind:'care',sid,area:pre.area||null,type:pre.type||null,action:pre.action||null,finding:pre.finding||'',follow:sid?nextClassDate(ST(sid)):addDays(TODAY,2),cand:true,dkey:pre.dkey};
  if(ME.role=='native_teacher'&&M.area&&!NATIVE_AREAS.includes(M.area))M.area=null;
  M._init=careSnap();
  showModal(careModal);
}
function careModal(){
  const st=M.sid?ST(M.sid):null,areas=ME.role=='native_teacher'?NATIVE_AREAS:Object.keys(AREAS);
  const done=[M.sid,M.area,M.type,M.finding.trim(),M.action].map(Boolean);
  return `<div class="row"><h3 class="sp">케어 기록${st?' · '+esc(st.name):''}</h3><div class="stepper">${done.map(d=>`<i class="${d?'on':''}"></i>`).join('')} ${done.filter(Boolean).length}/5</div></div>
  <div class="small muted" style="margin-top:4px">평소와 다르게 무언가를 해줬을 때만 기록합니다. 목표 30초.</div>
  ${st?'':`<label class="lb">학생</label><select onchange="M.sid=this.value;if(this.value)M.follow=nextClassDate(ST(this.value));rm()"><option value="">선택</option>${myStudents().map(s=>`<option value="${s.id}" ${M.sid==s.id?'selected':''}>${esc(s.name)} · ${esc(CL(s.cls).name)}</option>`).join('')}</select>`}
  <label class="lb">영역</label>${chips(areas.map(a=>[a,AREAS[a]]),M.area,'area')}
  <label class="lb">유형</label>${chips(Object.entries(TYPES),M.type,'type')}
  <label class="lb">발견 한 줄</label><input id="mf" value="${esc(M.finding)}" oninput="M.finding=this.value" placeholder="예: 관계대명사 which/that 구분 반복 오답">
  <label class="lb">조치</label>${chips(Object.entries(ACTIONS),M.action,'action')}
  <div class="row" style="margin-top:6px;align-items:flex-end"><div style="width:180px"><label class="lb">확인 예정일 (기본: 다음 수업)</label><input type="date" value="${M.follow}" onchange="M.follow=this.value"></div>
   <label class="toggle" style="margin-bottom:8px"><input type="checkbox" ${M.cand?'checked':''} onchange="M.cand=this.checked"><i></i>리포트 후보</label></div>
  <div class="mfoot"><button class="btn" onclick="closeModal()">취소</button><button class="btn pri" onclick="saveCare()">${ic('check',14)}저장</button></div>`;
}
function saveCare(){
  const f=document.getElementById('mf');if(f)M.finding=f.value;
  if(!M.sid||!M.area||!M.type||!M.finding.trim()||!M.action)return toast('학생·영역·유형·한 줄·조치를 모두 골라주세요',1);
  DIRTY=true;
  DB.care.push({id:nid('CR'),sid:M.sid,teacher:ME.id,area:M.area,type:M.type,finding:M.finding.trim(),action:M.action,action_note:'',follow:M.follow,result:null,result_note:'',cand:M.cand,created:TODAY});
  if(M.dkey)dismissed.add(M.dkey);
  if(churnOf(ST(M.sid)).level!='low'&&['new','asked',undefined].includes(DB.riskStatus[M.sid]?.status))setRisk(M.sid,M.action=='parent'?'contacted':'acting');
  closeModal();toast(`케어 기록 저장 · ${md(M.follow)}에 결과 확인 알림`);render();
}

function setAtt(ss,sid,k){DIRTY=true;DRAFT[ss][sid].att=k;render()}

function cycHw(ss,sid,it){DIRTY=true;const o=['','O','△','X'],d=DRAFT[ss][sid].hw;d[it]=o[(o.indexOf(d[it])+1)%4];render()}

function saveEntry(ssid){
  const sess=DB.sessions.find(s=>s.id==ssid),dr=DRAFT[ssid];

  if(miss.length)return toast('단어 점수 미입력: '+miss.join(', '),1);
  DIRTY=true;
  DB.att=DB.att.filter(a=>a.sess!=ssid);DB.scores=DB.scores.filter(a=>a.sess!=ssid);DB.hw=DB.hw.filter(a=>a.sess!=ssid);
  let n=0;
  Object.entries(dr).forEach(([sid,d])=>{
    DB.att.push({sid,sess:ssid,date:sess.date,status:d.att});
    if(d.att=='absent')return;
    DB.scores.push({id:nid('SC'),sid,sess:ssid,date:sess.date,type:'word',score:+d.score,max:30,passed:+d.score>=DB.settings.pass,wrong:d.wrong||null});

    const sug=[];
    if(+d.score<DB.settings.pass)sug.push(['단어 기준 미달',`단어 재시험 (${d.score}/30)`,true]);

}

// 조교가 출근하면 맨 위: 지난 출근 이후 바뀐 것 (성적·상담 내용은 빼고)
function sinceCard(by){
  const last=lastShift(ME.id),sids=Object.keys(by);
  const notes=DB.notes.filter(n=>sids.includes(n.sid)); // 오늘 강당에 오는 학생에게 남긴 당부
  const carried=Object.values(by).flat().filter(t=>t.from&&t.avail>last);
  const fresh=sids.filter(sid=>adaptOf(ST(sid)));
  const absent=[...new Set(DB.att.filter(a=>a.date>last&&a.status=='absent'&&sids.includes(a.sid)).map(a=>a.sid))];
  const other=DB.logs.filter(l=>l.date>last&&l.assistant!=ME.id),otherInc=other.filter(l=>l.outcome!='done').length;
  const line=(c,t,body)=>`<div class="task" style="align-items:flex-start;flex-wrap:wrap"><span class="bd ${c}" style="min-width:64px;justify-content:center">${t}</span><span class="sp" style="font-weight:500">${body}</span></div>`;
  return `<div class="card mb"><div class="chead"><h3>지난 출근(${md(last)}) 이후 바뀐 것</h3><span class="small muted">오늘 강당 학생 ${sids.length}명 기준</span></div>

const prevMonth=m=>{const d=D(m+'-01');d.setMonth(d.getMonth()-1);return fmt(d).slice(0,7)};
function bundle(sid,m){

    word:{avg:avg(sc.filter(x=>x.date.startsWith(m))),prev:avg(sc.filter(x=>x.date.startsWith(pm))),tests:sc.filter(x=>x.date.startsWith(m)).length,pass:sc.filter(x=>x.date.startsWith(m)&&x.passed).length},
    homework:{rate:hw.length?hw.filter(h=>h.status=='O').length/hw.length:null,total:hw.length},

const ACT_PARENT={retest:'다시 시험을 보며',extra:'추가 과제로',oneone:'1:1로 다시 설명하며',recheck:'수업 중에 다시 확인하며',seat:'자리를 조정해 집중을 도우며',parent:'가정과 소통하며',praise:'칭찬으로 격려하며',etc:'따로 챙기며'};
