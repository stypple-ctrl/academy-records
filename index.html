<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>학원 기록관리 · 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#eceff1;--surf:#f4f6f7;--card:#f8f9fa;--line:#e2e6e9;--text:#1f2a2e;--muted:#7a868c;--faint:#a8b2b7;
  --acc:#2ea58a;--acc2:#5cc5ac;--acc-soft:#dcf1ea;--acc-ink:#1b7a65;
  --red:#e0654f;--red-soft:#fbe6e1;--amber:#e09a2f;--amber-soft:#fbefd9;--blue:#4b7bd8;--blue-soft:#e3ebfa;--gray-soft:#e7eaec;
  --raise:6px 6px 14px rgba(160,170,178,.38),-6px -6px 14px rgba(255,255,255,.95);
  --raise-sm:3px 3px 7px rgba(160,170,178,.35),-3px -3px 7px rgba(255,255,255,.95);
  --inset:inset 3px 3px 7px rgba(160,170,178,.38),inset -3px -3px 7px rgba(255,255,255,.95);
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;cursor:pointer}
.small{font-size:12px}.muted{color:var(--muted)}.b{font-weight:700}
h1,h2,h3,h4{margin:0;letter-spacing:-.01em}
h2{font-size:20px}h3{font-size:16px}h4{font-size:14px}

/* layout */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;padding:4px 10px 18px}
.logo .mk{width:32px;height:32px;border-radius:10px;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:var(--raise-sm)}
.logo .demo{font-size:10px;font-weight:700;color:var(--acc-ink);background:var(--acc-soft);padding:2px 7px;border-radius:99px}
.navb{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;border:0;background:transparent;cursor:pointer;text-align:left;color:var(--muted);font-weight:600;white-space:nowrap}
.navb svg{width:18px;height:18px;flex:none}
.navb:hover{color:var(--text)}
.navb.on{background:var(--acc);color:#fff;box-shadow:var(--raise-sm)}
.side .grow{flex:1}
.promo{border-radius:var(--r);background:var(--acc-soft);padding:16px;font-size:12px;color:var(--acc-ink)}
.promo b{display:block;font-size:14px;margin-bottom:4px;color:var(--text)}
.main{padding:22px 28px 60px;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.topbar .ttl{flex:1;min-width:200px}
.topbar .crumb{font-size:12px;color:var(--muted)}
.me{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 6px;border-radius:99px;background:var(--card);box-shadow:var(--raise-sm)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--acc);font-size:13px;flex:none}
.av.lg{width:84px;height:84px;font-size:30px;border-radius:24px}
.me .nm{font-weight:700;font-size:13px;line-height:1.1}.me .rl{font-size:11px;color:var(--muted)}
.datechip{font-size:12px;color:var(--muted);padding:8px 14px;border-radius:99px;box-shadow:var(--inset);background:var(--surf)}

/* cards & grid */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--raise);padding:18px 20px;min-width:0}
.card.flat{box-shadow:none;background:var(--surf)}
.card.in{box-shadow:var(--inset);background:var(--surf)}
.chead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.chead h3{flex:1}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:1.35fr 1fr}.g2e{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.gside{grid-template-columns:300px 1fr}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
@media (max-width:1180px){.g5{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:980px){.g2,.g2e,.g3,.gside{grid-template-columns:1fr}}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:12px 16px;gap:6px}
  .side .grow,.promo{display:none}.logo{padding:4px 10px 4px 0}
  .main{padding:16px 16px 60px}
  .g5,.g4{grid-template-columns:repeat(2,1fr)}
}

/* buttons — soft neumorphic pills */
.btn{border:0;border-radius:99px;padding:9px 18px;background:var(--card);box-shadow:var(--raise-sm);cursor:pointer;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn:active{box-shadow:var(--inset);transform:none}
.btn.pri{background:var(--acc);color:#fff}
.btn.dark{background:#8f9aa0;color:#fff}
.btn.sm{padding:6px 13px;font-size:12px}
.btn.ghost{box-shadow:none;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;box-shadow:none;cursor:not-allowed;transform:none}
.btn svg{width:15px;height:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;border-radius:99px;padding:8px 14px;background:var(--surf);box-shadow:var(--raise-sm);cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);transition:.12s}
.chip:hover{color:var(--text)}
.chip.on{box-shadow:var(--inset);color:var(--acc-ink);background:var(--acc-soft)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-left:6px;vertical-align:middle}
.seg{display:inline-flex;padding:4px;border-radius:99px;box-shadow:var(--inset);background:var(--surf);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:99px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--raise-sm)}
.seg button.on.g{background:var(--acc);color:#fff}.seg button.on.a{background:var(--amber);color:#fff}.seg button.on.r{background:var(--red);color:#fff}.seg button.on.b{background:var(--blue);color:#fff}
input[type=text],input[type=number],input[type=date],input:not([type]),select,textarea{border:0;border-radius:14px;padding:10px 14px;background:var(--surf);box-shadow:var(--inset);outline:none;width:100%}
input:focus,select:focus,textarea:focus{box-shadow:var(--inset),0 0 0 2px var(--acc2)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8a969b 50%),linear-gradient(135deg,#8a969b 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.filters select{flex:1 1 150px;width:auto;min-width:140px}
label.lb{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 7px}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:13px}
.toggle i{width:44px;height:26px;border-radius:99px;box-shadow:var(--inset);background:var(--surf);position:relative;transition:.2s}
.toggle i:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--card);box-shadow:var(--raise-sm);transition:.2s}
.toggle input{display:none}
.toggle input:checked+i{background:var(--acc)}
.toggle input:checked+i:after{left:21px}

/* badges */
.bd{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.bd.g{background:var(--acc-soft);color:var(--acc-ink)}.bd.r{background:var(--red-soft);color:#b8432f}.bd.a{background:var(--amber-soft);color:#a86a10}.bd.b{background:var(--blue-soft);color:#2f5bb4}.bd.n{background:var(--gray-soft);color:var(--muted)}

/* KPI */
.kpi{display:flex;align-items:center;gap:14px}
.kpi .kt{font-size:12px;color:var(--muted);font-weight:600}
.kpi .kv{font-size:24px;font-weight:800;letter-spacing:-.02em}
.kpi .ks{font-size:11.5px;color:var(--muted)}
.ring-bg{fill:none;stroke:var(--gray-soft);stroke-width:7}
.ring-fg{fill:none;stroke-width:7;stroke-linecap:round;transition:stroke-dasharray .6s}
.ring-t{font-weight:800;font-size:15px;fill:var(--text)}
.ring-s{font-size:9px;fill:var(--muted)}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{font-size:10px;fill:var(--faint)}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:18px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;height:100%}
.btrack{flex:1;width:100%;max-width:38px;border-radius:10px;background:var(--gray-soft);position:relative;display:flex;flex-direction:column-reverse;overflow:hidden}
.bfill{width:100%;transition:height .5s}
.bval{font-size:11px;font-weight:700}
.blab{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
.hbar{height:12px;border-radius:99px;background:var(--gray-soft);overflow:hidden;display:flex}
.hbar span{display:block;height:100%}
.meter{height:8px;border-radius:99px;box-shadow:var(--inset);background:var(--surf);overflow:hidden;min-width:60px}
.meter span{display:block;height:100%;border-radius:99px;background:var(--acc)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;font-size:11px;text-align:center}
.cal .h{color:var(--faint);font-weight:600;padding-bottom:2px}
.cal .d{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-weight:600;color:var(--muted);background:var(--surf)}
.cal .d.l1{background:#cdeee4;color:var(--acc-ink)}.cal .d.l2{background:#93d9c4;color:#11584a}.cal .d.l3{background:var(--acc);color:#fff}
.cal .d.t{outline:2px solid var(--acc);outline-offset:1px}
.formula{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--surf);box-shadow:var(--inset);border-radius:12px;padding:10px 12px;line-height:1.7}
.formula b{color:var(--acc-ink)}.formula .bad{color:var(--red);font-weight:700}

/* flow: 발견 → 조치 → 결과 */
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.flow .st{flex:1;min-width:110px;background:var(--surf);border-radius:12px;padding:8px 11px;font-size:12.5px;position:relative}
.flow .st .k{font-size:10.5px;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.flow .ar{display:grid;place-items:center;width:22px;color:var(--faint);font-weight:700}
.flowbig{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flowbig .nd{flex:1;min-width:90px;text-align:center;padding:14px 8px;border-radius:16px;background:var(--card);box-shadow:var(--raise-sm)}
.flowbig .nd .v{font-size:22px;font-weight:800}.flowbig .nd .t{font-size:11.5px;color:var(--muted)}
.flowbig .arw{color:var(--acc);font-weight:800}

/* list items */
.ci{display:flex;gap:14px;align-items:center;padding:13px 14px;border-radius:16px;background:var(--surf);margin-bottom:10px}
.ci .rk{width:46px;flex:none;text-align:center}
.ci .main2{flex:1;min-width:0}
.ci .nm{font-weight:700;font-size:15px}
.ci .why{font-size:13px;color:var(--text);margin-top:2px}
.ci .more{font-size:11.5px;color:var(--muted);margin-top:3px}
.ci .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.ci{flex-wrap:wrap}.ci .acts{width:100%;justify-content:flex-start}}
.tblw{overflow-x:auto;margin:0 -4px}
table.t{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:13px}
table.t th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:left;padding:4px 10px;white-space:nowrap}
table.t td{background:var(--surf);padding:9px 10px;vertical-align:middle}
table.t td:first-child{border-radius:12px 0 0 12px}table.t td:last-child{border-radius:0 12px 12px 0}
table.t tr.click td{cursor:pointer}table.t tr.click:hover td{background:var(--acc-soft)}
.empty{color:var(--muted);text-align:center;padding:24px;font-size:13px}
.hwb{width:34px;height:34px;border-radius:11px;border:0;cursor:pointer;font-weight:800;background:var(--card);box-shadow:var(--raise-sm);color:var(--faint)}
.hwb.O{color:var(--acc-ink);background:var(--acc-soft);box-shadow:var(--inset)}.hwb.△{color:#a86a10;background:var(--amber-soft);box-shadow:var(--inset)}.hwb.X{color:#b8432f;background:var(--red-soft);box-shadow:var(--inset)}
.scin{width:74px!important;text-align:center;font-weight:700}

/* remedial cards */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:20px}
.rc .rrow{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.rc .lab{width:54px;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.task{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--surf);margin-top:6px;font-size:13px;font-weight:600}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tld{font-size:12px;font-weight:700;color:var(--muted);margin:16px 0 8px;position:relative}
.tld:before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--card);box-shadow:0 0 0 3px var(--acc-soft),0 0 0 4px var(--acc)}
.ev{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:12px;background:var(--surf);margin-bottom:6px;font-size:13px}
.ev .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:12px;font-weight:800}

/* modal & toast */
.mbg{position:fixed;inset:0;background:rgba(40,50,55,.28);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--card);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.18);width:min(620px,100%);max-height:90vh;overflow:auto;padding:24px}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--card);box-shadow:var(--raise);border-radius:16px;padding:13px 20px;font-weight:600;z-index:60;display:flex;align-items:center;gap:10px;animation:up .25s}
.toast .ck{width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:12px}
.toast.err .ck{background:var(--red)}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}
.stepper{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted);font-weight:600}
.stepper i{width:22px;height:6px;border-radius:99px;background:var(--gray-soft)}.stepper i.on{background:var(--acc)}

/* login */
.login{max-width:1000px;margin:0 auto;padding:48px 20px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;margin-top:26px}
.lcard{border:0;text-align:left;cursor:pointer;background:var(--card);box-shadow:var(--raise);border-radius:22px;padding:20px;transition:.15s}
.lcard:hover{transform:translateY(-3px)}
.lcard:active{box-shadow:var(--inset)}
.guide{margin-top:30px}
.guide ol{margin:8px 0 0;padding-left:20px;line-height:1.9}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
/* ============ utils ============ */
const TODAY='2026-10-01';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D=s=>new Date(s+'T00:00:00');
const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return fmt(d)};
const diff=(a,b)=>Math.round((D(a)-D(b))/864e5);
const md=s=>s?`${+s.slice(5,7)}/${+s.slice(8,10)}`:'';
const byDate=(a,b)=>a.date<b.date?-1:a.date>b.date?1:0;
const avg=a=>a.length?a.reduce((x,y)=>x+(y.score??y),0)/a.length:null;
const pct=v=>v==null?'–':Math.round(v*100)+'%';
const nowHM=()=>{const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const WD='일월화수목금토';
let seed=1;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const pick=a=>a[Math.floor(rnd()*a.length)];const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
let uid=0;const nid=p=>p+(++uid);
let gid=0;

/* ============ code tables ============ */
const ROLE={director:'원장',teacher:'담임 교사',native_teacher:'원어민 교사',assistant:'조교'};
const AREAS={word:'단어',listening:'듣기',reading:'독해',grammar:'문법',essay:'에세이',speaking:'스피킹',attitude:'숙제·태도'};
const NATIVE_AREAS=['essay','speaking','attitude'];
const TYPES={repeat:'반복 오답',drop:'점수 하락',missing:'미제출 반복',concept:'개념 이해 부족',behavior:'수업 태도',positive:'긍정 변화'};
const ACTIONS={retest:'재시험',extra:'추가 숙제',oneone:'1:1 재설명',recheck:'수업 중 재확인',seat:'자리 조정',parent:'학부모 연락',praise:'칭찬',etc:'기타'};
const RESULTS={improved:'개선',same:'유지',worse:'악화'};
const HW={listening:'듣기',reading:'독해',grammar:'문법',essay:'에세이',speaking:'스피킹 영상'};
const OUTCOME={done:'완료',partial:'부분',incomplete:'미완'};
const PASS={'10':'10분 이내','30':'30분 이내','60':'1시간'};
const ATT={focus:'집중',normal:'보통',distract:'산만'};
const STAGE=['시작 전','진행 중','절반','거의 완료'];
const DAYN={MWF:'월수금',TT:'화목'};
const COL={g:'var(--acc)',g2:'var(--acc2)',r:'var(--red)',a:'var(--amber)',b:'var(--blue)',n:'#c5cdd1'};
const RANK={1:['확인','b'],2:['경고','r'],3:['칭찬','g'],4:['공백','n']};

/* ============ icons ============ */
const IC={
 dash:'<path d="M4 13h6V4H4zM14 20h6V11h-6zM4 20h6v-4H4zM14 7h6V4h-6z"/>',
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/>',
 run:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/>',
 file:'<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',

  seed=20261001;uid=0;
  const db={users:[

  const SUR='김이박최정강조윤장임한오서신권황안송류홍'.split('');

  const PAT=['drop','normal','fail2','normal','rise','normal','hwmiss','normal','absent','normal','remedial3','normal','fastpass','normal','gap','normal','worse','normal','slump','normal','normal','normal','normal','normal'];
  let k=0;

    for(let i=0;i<6;i++){
      const pat=PAT[k%PAT.length];k++;
      let ab=22+rnd()*6.5;
      if(pat=='fail2')ab=26;if(pat=='rise')ab=21;if(pat=='slump')ab=27.5;if(pat=='remedial3'||pat=='fastpass')ab=21.5;

  db.classes.filter(c=>c.type=='homeroom').forEach(c=>{
    let no=0,idx=0;
    for(let d='2026-08-03';d<=TODAY;d=addDays(d,1)){
      if(!isClassDay(c,d))continue;
      const inTerm=d>=c.termStart;
      const s={id:nid('SS'),cls:c.id,date:d,no:null,regular:true,note:'',items:['listening','reading','grammar'].concat(idx%3==0?['essay']:[]),pending:false,inTerm};
      idx++;

        if(c.id=='C43'&&idx%2==0){s.regular=false;s.note='레벨테스트·학교 행사'}

      if(d==TODAY&&c.start>='19:00')s.pending=true;
      db.sessions.push(s);
    }
  });

  // attendance / scores / homework
  db.students.forEach(st=>{
    const ss=db.sessions.filter(s=>s.cls==st.cls&&!s.pending);const n=ss.length;const sc=[];
    ss.forEach((s,i)=>{
      const fe=n-1-i;
      let absent=rnd()<0.03&&fe>2;if(st.pattern=='absent'&&fe==0)absent=true;
      db.att.push({sid:st.id,sess:s.id,date:s.date,status:absent?'absent':(rnd()<0.04?'late':'present')});
      if(absent)return;
      let ab=st.ability;if(st.pattern=='slump'&&s.date>addDays(TODAY,-28))ab-=7;
      let v=Math.round(ab+(rnd()+rnd()-1)*4);
      if(st.pattern=='drop'&&fe==0){const p=sc.slice(-3);v=Math.round(p.reduce((a,b)=>a+b,0)/p.length*0.66)}
      if(st.pattern=='fail2'&&fe<=1)v=ri(19,22);
      if(st.pattern=='rise'&&fe<=2)v=[26,28,30][2-fe];
      v=Math.max(0,Math.min(30,v));sc.push(v);
      db.scores.push({id:nid('SC'),sid:st.id,sess:s.id,date:s.date,type:'word',score:v,max:30,passed:v>=24});
      s.items.forEach(it=>{
        const p=ab>=26?0.9:0.8,r=rnd();
        let stt=r<p?'O':r<p+0.11?'△':'X';
        if(st.pattern=='hwmiss'&&fe<=1&&it=='reading')stt='X';
        db.hw.push({sid:st.id,sess:s.id,date:s.date,item:it,status:stt});
      });
    });
  });

  // care records
  const FIND={repeat:['과거완료 시제 문제 반복 오답','관계대명사 which/that 구분 반복 오답','단어 철자 -tion/-sion 반복 실수'],
    drop:['단어 점수 지난주 대비 6점 하락','챕터 테스트 점수 하락, 앞부분 범위 약함'],
    missing:['독해 숙제 2회 연속 미제출','듣기 숙제 녹음 파일 미제출 반복'],
    concept:['to부정사 vs 동명사 구분 개념 부족','5형식 목적보어 이해 부족'],
    behavior:['수업 중 잡담 잦음, 집중 시간 짧음','필기 안 하고 엎드려 있음'],
    positive:['발표 처음으로 자원함','오답노트 스스로 작성해 옴']};
  const NFIND={essay:['서론 topic sentence 없이 시작','문단 연결어 사용이 늘어남'],speaking:['/r/ /l/ 발음 구분 개선 중','말끝 흐림, 자신감 부족'],attitude:['스피킹 영상 마감 2회 지연']};
  const AREA_BY={drop:'word',repeat:'grammar',missing:'reading',concept:'grammar',behavior:'attitude',positive:'word'};
  const ACT_BY={drop:'retest',repeat:'oneone',missing:'extra',concept:'oneone',behavior:'seat',positive:'praise'};
  const NOTE={improved:['재시험 27/30 통과','다음 수업 같은 유형 정답','숙제 제출 재개'],same:['같은 유형 여전히 헷갈림'],worse:['추가 숙제도 미제출','점수 추가 하락']};
  const mk=(st,teacher,created,type,area,result,finding)=>{
    const follow=addDays(created,ri(2,4));
    let res=result;
    if(res===undefined)res=follow<TODAY&&rnd()<0.88?(rnd()<0.62?'improved':rnd()<0.8?'same':'worse'):null;
    db.care.push({id:nid('CR'),sid:st.id,teacher,area,type,finding:finding||pick(FIND[type]),action:ACT_BY[type],action_note:'',follow,result:res,
      result_note:res?pick(NOTE[res]):'',cand:rnd()<0.8,created});
  };
  db.students.forEach((st,i)=>{
    if(st.pattern=='gap'){mk(st,st.homeroom,'2026-09-04','positive','word','improved');return}
    const cnt=ri(1,3);
    for(let j=0;j<cnt;j++){const t=pick(Object.keys(TYPES));mk(st,st.homeroom,addDays('2026-09-01',ri(3,29)),t,AREA_BY[t])}
    if(st.pattern=='worse'){mk(st,st.homeroom,'2026-09-15','missing','reading','worse');mk(st,st.homeroom,'2026-09-22','behavior','attitude','worse')}
    if(i%3==0){const a=pick(['essay','speaking']);mk(st,'N1',addDays('2026-09-01',ri(5,28)),a=='essay'?'repeat':'positive',a,undefined,pick(NFIND[a]))}
  });

  // remedial tickets & logs
  const addLog=(t,date,out,st,fast)=>{
    t.status=out;const c=db.classes.find(x=>x.id==st.cls);const h=+c.start.slice(0,2)+1;
    const pass=out!='done'?'60':fast?'10':rnd()<0.2?'10':rnd()<0.62?'30':'60';
    db.logs.push({id:nid('LG'),ticket:t.id,sid:st.id,task:t.task,date,assistant:pick(['A1','A2']),checkIn:`${h}:0${ri(0,9)}`,
      c20:pass=='10'?null:ri(1,3),c40:pass=='60'?ri(1,3):null,outcome:out,pass,att:out=='done'?pick(['focus','focus','normal']):pick(['normal','distract','distract']),
      extra:pass!='60'&&rnd()<0.5?pick(['E1','E2','E3','E4']):null,extraDone:rnd()<0.7,memo:''});
  };
  db.students.forEach(st=>{
    const ss=db.sessions.filter(s=>s.cls==st.cls&&!s.pending);let forced=0;
    ss.forEach((s,i)=>{
      const tasks=[];const sc=db.scores.find(x=>x.sess==s.id&&x.sid==st.id);
      if(sc&&!sc.passed)tasks.push(['단어 기준 미달',`단어 재시험 (${sc.score}/30)`]);
      db.hw.filter(h=>h.sess==s.id&&h.sid==st.id&&h.status=='X').forEach(h=>tasks.push(['숙제 미완',`${HW[h.item]} 숙제 완료`]));
      tasks.forEach(([reason,task])=>{
        const t={id:nid('TK'),sid:st.id,issuedBy:st.homeroom,reason,task,src:s.date,from:null,status:'open',avail:s.date};
        db.tickets.push(t);
        if(s.date==TODAY)return;
        let out=rnd()<0.85?'done':rnd()<0.5?'partial':'incomplete';
        if(st.pattern=='remedial3'){out='done';if(s.date>='2026-09-01'&&forced<3){out='incomplete';forced++}}
        if(st.pattern=='fastpass')out='done';
        addLog(t,s.date,out,st,st.pattern=='fastpass'&&s.date>='2026-09-01');
        if(out!='done'){
          const nx=ss[i+1];
          const ct={id:nid('TK'),sid:st.id,issuedBy:st.homeroom,reason:t.reason,task:t.task,src:t.src,from:t.id,status:'open',avail:nx?nx.date:addDays(s.date,1)};
          db.tickets.push(ct);
          if(nx&&nx.date<TODAY)addLog(ct,nx.date,'done',st,false);
        }
      });
    });
  });

  // showcase
  const SHC=['주제문이 분명해짐','문장 길이와 연결어가 다양해짐','발음이 또렷해지고 속도가 안정됨','결론 문단 구성이 좋아짐','자기 경험을 구체적으로 표현함'];
  db.students.forEach(st=>['2026-08','2026-09'].forEach(m=>db.showcase.push({id:nid('SH'),sid:st.id,month:m,kind:pick(['essay','speaking']),url:`https://drive.google.com/demo/${st.id}-${m}`,comment:pick(SHC)})));
  return db;
}

const ST=id=>DB.students.find(s=>s.id==id);
const CL=id=>DB.classes.find(c=>c.id==id);
const US=id=>DB.users.find(u=>u.id==id);
const scoresOf=sid=>DB.scores.filter(s=>s.sid==sid).sort(byDate);
const logsOf=sid=>DB.logs.filter(l=>l.sid==sid).sort(byDate);
const sessionsOf=cid=>DB.sessions.filter(s=>s.cls==cid&&!s.pending);
const termInc=sid=>DB.logs.filter(l=>l.sid==sid&&l.outcome=='incomplete'&&l.date>='2026-09-01').length;
const stLabel=st=>`${st.name} · ${st.grade} ${CL(st.cls).name.split(' ').at(-1)}반`;
const phoneOf=st=>ME&&(ME.role=='director'||ME.id==st.homeroom)?st.phone:st.phone.replace(/-(\d{4})-/,'-****-');
const lastCare=(sid,tid)=>DB.care.filter(r=>r.sid==sid&&(!tid||r.teacher==tid)).map(r=>r.created).sort().at(-1);
function studentsOf(cid){const c=CL(cid);return DB.students.filter(s=>c.type=='native'?s.nclass==cid:s.cls==cid)}
function myStudents(){
  if(ME.role=='teacher')return DB.students.filter(s=>s.homeroom==ME.id);
  if(ME.role=='native_teacher')return DB.students.filter(s=>CL(s.nclass).teacher==ME.id);
  return DB.students;
}
function myClasses(){
  if(ME.role=='teacher'||ME.role=='native_teacher')return DB.classes.filter(c=>c.teacher==ME.id);
  if(ME.role=='assistant')return DB.classes.filter(c=>c.type=='homeroom');
  return DB.classes;
}
function nextClassDate(st){const c=CL(ME.role=='native_teacher'?st.nclass:st.cls);let d=addDays(TODAY,1);for(let i=0;i<10;i++,d=addDays(d,1))if(isClassDay(c,d))return d;return addDays(TODAY,2)}
function progressOf(c){
  let total=0,el=0;for(let d=c.termStart;d<='2026-11-30';d=addDays(d,1))if(isClassDay(c,d)){total++;if(d<=TODAY)el++}
  const done=DB.sessions.filter(s=>s.cls==c.id&&s.inTerm&&s.regular).length;
  const pr=done/c.planned,er=el/total;return{done,planned:c.planned,el,total,pr,er,delayed:er-pr>=0.10};
}

/* ============ rules: 오늘 챙길 학생 (5-1) ============ */
let dismissed=new Set();
function careItems(cid){
  const c=CL(cid),S=DB.settings,native=c.type=='native',out=[];
  for(const st of studentsOf(cid)){
    const its=[];
    const add=(rank,code,since,text,act,ex={})=>{const key=st.id+'|'+code;if(!dismissed.has(key))its.push({rank,code,since,text,act,key,sid:st.id,...ex})};
    const recs=DB.care.filter(r=>r.sid==st.id&&(native?r.teacher==c.teacher:US(r.teacher).role=='teacher'));
    recs.filter(r=>!r.result&&r.follow<=TODAY).forEach(r=>add(1,'res'+r.id,r.follow,`${AREAS[r.area]} 결과 확인 — "${r.finding}" (${ACTIONS[r.action]})`,'result',{rid:r.id}));
    if(!native){
      const sc=scoresOf(st.id),last=sc.at(-1);
      if(sc.length>=4){const p=sc.slice(-4,-1),a=avg(p);if(last.score<=a*(1-S.dropPct/100))add(2,'drop',last.date,`단어 ${last.score}/30 · 최근 3회 평균 ${a.toFixed(1)} 대비 ${Math.round((1-last.score/a)*100)}% 하락`,'care',{preset:{area:'word',type:'drop'}})}
      if(sc.length>=2&&sc.slice(-2).every(x=>x.score<S.pass))add(2,'fail2',sc.at(-2).date,`단어 통과 기준(${S.pass}개) 미만 2회 연속 · ${sc.slice(-2).map(x=>x.score).join(' → ')}`,'care',{preset:{area:'word',type:'repeat'}});
      for(const it of Object.keys(HW)){const hs=DB.hw.filter(h=>h.sid==st.id&&h.item==it).sort(byDate).slice(-2);
        if(hs.length==2&&hs.every(h=>h.status=='X'))add(2,'hw'+it,hs[0].date,`${HW[it]} 숙제 2회 연속 미제출`,'care',{preset:{area:it=='essay'?'essay':it,type:'missing'}})}
      const at=DB.att.filter(a=>a.sid==st.id).sort(byDate).at(-1);
      if(at&&at.status=='absent')add(2,'abs',at.date,`${md(at.date)} 결석 후 첫 수업 · 보충 여부 확인`,'care',{preset:{area:'attitude',type:'behavior'}});
      const lg=logsOf(st.id),ll=lg.at(-1);
      if(ll&&ll.outcome=='incomplete')add(2,'rinc',ll.date,`나머지 미완료 귀가 (${md(ll.date)}) · 이월 과제 확인`,'care',{preset:{area:'attitude',type:'missing'}});
      if(termInc(st.id)==2)add(2,'inc2',ll?ll.date:TODAY,'나머지 미완료 누적 2회 · 케어 기록 초안이 준비됨','care',{preset:{area:'attitude',type:'missing',finding:'나머지 학습 미완료 2회 누적 (자동 초안)'}});
      const fast=lg.filter(l=>l.date>addDays(TODAY,-28)&&l.pass=='10'&&l.outcome=='done').length;
      if(fast>=S.fastPass)add(2,'fast',addDays(TODAY,-28),`나머지 10분 내 통과 최근 4주 ${fast}회 · 집에서 준비하는 습관 확인`,'care',{preset:{area:'attitude',type:'missing'}});
      if(sc.length>=3){const pm=Math.max(...sc.slice(0,-1).map(x=>x.score));
        if(last.score>pm)add(3,'best',last.date,`개인 최고점 ${last.score}/30 달성`,'praise');
        else if(sc.slice(-3).every((x,i,a)=>!i||x.score>a[i-1].score))add(3,'rise3',last.date,`단어 3회 연속 상승 · ${sc.slice(-3).map(x=>x.score).join(' → ')}`,'praise')}
    }
    const lc=recs.map(r=>r.created).sort().at(-1);
    if(!lc||diff(TODAY,lc)>=S.gapDays)add(4,'gap',lc||'2000-01-01',lc?`최근 ${diff(TODAY,lc)}일간 케어 기록 없음 · 이번 주 관찰 1건`:'케어 기록 없음 · 이번 주 관찰 1건','care');
    if(its.length){its.sort((a,b)=>a.rank-b.rank||(a.since<b.since?-1:1));out.push({st,top:its[0],rest:its.slice(1)})}
  }
  out.sort((a,b)=>a.top.rank-b.top.rank||(a.top.since<b.top.since?-1:1));
  return out;
}
/* 원장 위험 학생 (5-4) */
function riskOf(st){
  const r=[],S=DB.settings;
  const inc=termInc(st.id);if(inc>=S.incompleteRisk)r.push(['나머지 미완 '+inc+'회','r']);
  const sc=scoresOf(st.id),a=avg(sc.filter(x=>x.date>addDays(TODAY,-28))),b=avg(sc.filter(x=>x.date<=addDays(TODAY,-28)&&x.date>addDays(TODAY,-56)));
  if(a&&b&&a<=b*(1-S.riskDropPct/100))r.push([`단어 평균 ${Math.round((1-a/b)*100)}%↓`,'a']);
  const w=DB.care.filter(x=>x.sid==st.id&&x.result=='worse').length;if(w>=S.worseRisk)r.push(['악화 '+w+'건','r']);
  const lc=lastCare(st.id),g=lc?diff(TODAY,lc):99;if(g>=S.riskGapDays)r.push([`기록 공백 ${g}일`,'n']);
  return r;
}

function ring(p,{size=78,color=COL.g,center,sub}={}){
  const r=size/2-7,c=2*Math.PI*r,pp=Math.max(0,Math.min(1,p||0)),h=size/2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none"><circle cx="${h}" cy="${h}" r="${r}" class="ring-bg"/><circle cx="${h}" cy="${h}" r="${r}" class="ring-fg" stroke="${color}" stroke-dasharray="${(c*pp).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${h} ${h})"/>
  <text x="${h}" y="${sub?h-5:h}" text-anchor="middle" dominant-baseline="central" class="ring-t">${center??pct(p)}</text>${sub?`<text x="${h}" y="${h+11}" text-anchor="middle" class="ring-s">${sub}</text>`:''}</svg>`;
}
function donut(segs,{size=130,center='',sub=''}={}){
  const r=size/2-12,C=2*Math.PI*r,h=size/2,tot=segs.reduce((a,s)=>a+s.v,0)||1;let off=0;
  const arcs=segs.map(s=>{const len=C*s.v/tot;const el=`<circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${s.c}" stroke-width="14" stroke-dasharray="${Math.max(0,len-2).toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 ${h} ${h})"/>`;off+=len;return el}).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--gray-soft)" stroke-width="14"/>${arcs}
  <text x="${h}" y="${h-6}" text-anchor="middle" dominant-baseline="central" style="font-weight:800;font-size:22px;fill:var(--text)">${center}</text><text x="${h}" y="${h+14}" text-anchor="middle" style="font-size:10px;fill:var(--muted)">${sub}</text></svg>`;
}
const legend=segs=>`<div class="legend">${segs.map(s=>`<span><i style="background:${s.c}"></i>${s.l} <b style="color:var(--text)">${s.v}</b></span>`).join('')}</div>`;
function lineChart(pts,{min=0,max=30,ref=null,h=170,refLabel='',color=COL.g,showDots=true}={}){
  if(!pts.length)return '<div class="empty">데이터 없음</div>';
  const W=560,H=h,pl=30,pr=14,pt=14,pb=24,n=pts.length,id='lg'+(++gid);
  const x=i=>pl+(n==1?(W-pl-pr)/2:i*(W-pl-pr)/(n-1)),y=v=>pt+(1-(v-min)/(max-min))*(H-pt-pb);
  const path=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const ticks=[0,.25,.5,.75,1].map(t=>min+(max-min)*t);
  const every=Math.ceil(n/8);
  return `<svg viewBox="0 0 ${W} ${H}" class="chart"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
  ${ticks.map(t=>`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${pl-6}" y="${y(t)+3}" text-anchor="end">${Math.round(t)}</text>`).join('')}
  ${ref!=null?`<line x1="${pl}" x2="${W-pr}" y1="${y(ref)}" y2="${y(ref)}" stroke="var(--red)" stroke-dasharray="4 4" stroke-width="1.3"/><text x="${W-pr}" y="${y(ref)-5}" text-anchor="end" style="font-size:10px;fill:var(--red);font-weight:700">${refLabel}</text>`:''}
  <path d="${path}L${x(n-1)},${H-pb}L${x(0)},${H-pb}Z" fill="url(#${id})"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round"/>
  ${showDots?pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i==n-1?5:3}" fill="${p.c||(i==n-1?color:'#fff')}" stroke="${p.c||color}" stroke-width="2"><title>${p.l}: ${p.v}</title></circle>`).join(''):''}
  ${pts.map((p,i)=>i%every==0||i==n-1?`<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="middle">${p.l}</text>`:'').join('')}</svg>`;
}
function spark(vals,{w=90,h=26,ref=null}={}){
  if(vals.length<2)return '';const mn=Math.min(...vals,ref??99)-1,mx=Math.max(...vals)+1;
  const x=i=>i*(w-4)/(vals.length-1)+2,y=v=>h-2-(v-mn)/(mx-mn)*(h-4);

}

function actBtn(t){

  const pre=JSON.stringify({...(t.preset||{}),...(t.act=='praise'?{type:'positive',action:'praise',area:'word'}:{}),dkey:t.key}).replace(/"/g,'&quot;');
  return `<button class="btn sm pri" onclick='openCare("${t.sid}",${pre})'>${t.act=='praise'?'칭찬 기록':t.rank==4?'관찰 기록':'케어 기록'}</button>`;
}

  DIRTY=true;

function consultData(sid){

function reportPage(){
  if(ME.role=='assistant'||ME.role=='native_teacher')return deny();
  const list=myStudents();if(!REP.sid||!list.find(s=>s.id==REP.sid))REP.sid=list[0].id;
  const b=bundle(REP.sid,REP.month),key=REP.sid+'|'+REP.month;
  const cm=DB.comments[key]||(DB.comments[key]={draft:aiDraft(b),approvedBy:null,picked:b.care.filter(r=>r.result=='improved').map(r=>r.id)});
  const shBox=(x,t)=>`<div class="card flat" style="flex:1;min-width:150px"><div class="small muted b">${t}</div>${x?`<div style="margin:8px 0"><span class="bd ${x.kind=='essay'?'b':'g'}">${x.kind=='essay'?'에세이':'스피킹'}</span></div><div class="small">"${esc(x.comment)}"</div>`:'<div class="small muted" style="margin-top:8px">미선택</div>'}</div>`;
  return `<div class="card" style="margin-bottom:20px"><div class="row"><div style="width:280px"><select onchange="REP.sid=this.value;render()">${list.map(s=>`<option value="${s.id}" ${s.id==REP.sid?'selected':''}>${esc(s.name)} · ${esc(CL(s.cls).name)}</option>`).join('')}</select></div>
    <div class="seg">${reportMonths().map(m=>`<button class="${REP.month==m?'on':''}" onclick="REP.month='${m}';render()">${+m.slice(5)}월</button>`).join('')}</div><span class="sp"></span>
    <button class="btn" onclick="dlJSON()">${ic('dl',14)}JSON 내보내기</button>${ME.role=='director'?`<button class="btn" onclick="dlAll()">${ic('dl',14)}전체 학생 CSV</button>`:''}</div></div>
  <div class="grid g2">
   <div class="stack">
    <div class="card"><div class="chead"><h3>${esc(b.student.name)} · ${+REP.month.slice(5)}월 데이터 묶음</h3><span class="small muted">리포트 카드 생성의 입력</span></div>
      <div class="grid g3" style="gap:12px">
        <div class="card flat" style="text-align:center">${ring((b.word.avg||0)/30,{center:b.word.avg?.toFixed(1)??'–',sub:'단어 평균'})}<div class="small ${b.word.prev&&b.word.avg>=b.word.prev?'':'muted'}">${b.word.prev?`전월 ${b.word.prev.toFixed(1)} → ${(b.word.avg-b.word.prev>=0?'+':'')+(b.word.avg-b.word.prev).toFixed(1)}`:'전월 없음'}</div></div>
        <div class="card flat" style="text-align:center">${ring(b.homework.rate,{color:COL.b})}<div class="small muted">숙제 제출률</div></div>
        <div class="card flat" style="text-align:center">${ring(b.remedial.count?b.remedial.done/b.remedial.count:0,{center:b.remedial.count+'회',sub:'나머지',color:COL.a})}<div class="small muted">완료 ${b.remedial.done}회</div></div></div>
      <h4 style="margin:18px 0 8px">전월 대비</h4>${bars([{l:prevMonth(REP.month).slice(5)+'월 평균',v:+(b.word.prev||0).toFixed(1),c:COL.n},{l:REP.month.slice(5)+'월 평균',v:+(b.word.avg||0).toFixed(1),c:COL.g}],{max:30})}
      <div class="small muted" style="margin-top:8px">단어 시험 ${b.word.tests}회 중 ${b.word.pass}회 통과 (30점 만점 기준 평균)</div>
      <h4 style="margin:18px 0 8px">대표작 비교</h4><div class="row" style="align-items:stretch">${shBox(b.showcase.prev,prevMonth(REP.month).slice(5)+'월')}${shBox(b.showcase.this,REP.month.slice(5)+'월')}</div></div>
    <div class="card"><div class="chead"><h3>리포트 후보 케어 기록</h3><span class="small muted">담임이 골라서 문장으로 가공 · 원본은 공개 안 함</span></div>
      ${b.care.length?b.care.map(r=>`<label style="display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;cursor:pointer"><input type="checkbox" style="margin-top:12px" ${cm.picked.includes(r.id)?'checked':''} onchange="pickCare('${key}','${r.id}',this.checked)"><div style="flex:1">${careFlow(r)}</div></label>`).join(''):'<div class="empty">후보 없음</div>'}</div>
   </div>
   <div class="card" style="align-self:start"><div class="chead"><h3>AI 초안 코멘트</h3>${cm.approvedBy?`<span class="bd g">승인됨 · ${US(cm.approvedBy).name}</span>`:'<span class="bd a">검토 대기</span>'}</div>
     <div class="small muted" style="margin-bottom:10px">데모에서는 템플릿으로 생성합니다. 실제는 해당 학생 기록만 Claude API로 보내 생성하며, 승인 전에는 학부모에게 나가지 않습니다.</div>
     <textarea rows="13" oninput="DB.comments['${key}'].draft=this.value">${esc(cm.draft)}</textarea>
     <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" onclick="DB.comments['${key}'].draft=aiDraft(bundle(REP.sid,REP.month));render()">다시 생성</button><button class="btn pri" onclick="DB.comments['${key}'].approvedBy=ME.id;toast('승인 완료');render()">${ic('check',14)}승인</button></div></div>
  </div>`;
}
function pickCare(key,id,v){const p=DB.comments[key].picked;if(v)p.push(id);else p.splice(p.indexOf(id),1)}
function dlJSON(){const b=bundle(REP.sid,REP.month),cm=DB.comments[REP.sid+'|'+REP.month];
  dl(`리포트_${b.student.name}_${REP.month}.json`,JSON.stringify({...b,care:b.care.filter(r=>cm.picked.includes(r.id)),comment:cm},null,2),'application/json');toast('JSON 내보내기')}
function dlAll(){dl(`리포트데이터_${REP.month}.csv`,csv([['학생','학년','반','담임','단어 평균','전월','숙제 제출률','나머지 횟수','나머지 완료','리포트 후보 수'],...DB.students.map(s=>{const b=bundle(s.id,REP.month);return[s.name,s.grade,b.student.class,b.student.homeroom,b.word.avg?.toFixed(1),b.word.prev?.toFixed(1),pct(b.homework.rate),b.remedial.count,b.remedial.done,b.care.length]})]));toast('CSV 다운로드')}

/* ============ 대표작 (F8) ============ */
function showcasePage(){
  const list=myStudents(),m='2026-10',pm='2026-09';
  const done=list.filter(s=>DB.showcase.some(x=>x.sid==s.id&&x.month==m)).length;
  return `<div class="grid g4" style="margin-bottom:20px"><div class="card kpi">${ring(done/list.length,{center:done,sub:'/'+list.length})}<div><div class="kt">10월 대표작 선택</div><div class="kv">${pct(done/list.length)}</div><div class="ks">월 1회 필수</div></div></div></div>
  <div class="card"><div class="chead"><h3>10월 대표작</h3><span class="small muted">학생별 에세이 1편 또는 스피킹 영상 1개 · 9월과 나란히 비교</span></div>
  ${list.map(s=>{const p=DB.showcase.find(x=>x.sid==s.id&&x.month==pm),c=DB.showcase.find(x=>x.sid==s.id&&x.month==m);
   return `<div class="grid g2e" style="gap:14px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)">
    <div class="row" style="align-items:flex-start;flex-wrap:nowrap">${avatar(s.name)}<div><b>${esc(s.name)}</b> <span class="small muted">${esc(CL(s.nclass).name)}</span>
      <div class="card flat" style="margin-top:8px;padding:12px"><span class="small muted b">9월</span> ${p?`<span class="bd ${p.kind=='essay'?'b':'g'}">${p.kind=='essay'?'에세이':'스피킹'}</span><div class="small" style="margin-top:4px">"${esc(p.comment)}"</div>`:'없음'}</div></div></div>
    <div>${c?`<div class="card flat" style="padding:12px;background:var(--acc-soft)"><span class="small b" style="color:var(--acc-ink)">10월 ✓</span> <span class="bd ${c.kind=='essay'?'b':'g'}">${c.kind=='essay'?'에세이':'스피킹'}</span><div class="small" style="margin-top:4px">"${esc(c.comment)}"</div><div class="small muted">${esc(c.url)}</div></div>`:
      `<div class="row"><div class="seg" id="k-${s.id}" data-v="essay"><button class="on" onclick="pickKind('${s.id}','essay',this)">에세이</button><button onclick="pickKind('${s.id}','speaking',this)">스피킹</button></div></div>
       <input id="u-${s.id}" placeholder="파일 링크 (구글 드라이브, 유튜브 비공개)" style="margin-top:8px"><div class="row" style="margin-top:8px;flex-wrap:nowrap"><input id="c-${s.id}" placeholder="한 줄 코멘트"><button class="btn pri" onclick="saveShow('${s.id}')">저장</button></div>`}</div></div>`}).join('')}</div>`;
}
function pickKind(sid,k,el){const g=document.getElementById('k-'+sid);g.dataset.v=k;g.querySelectorAll('button').forEach(b=>b.classList.remove('on'));el.classList.add('on')}
function saveShow(sid){
  DIRTY=true;
  const c=document.getElementById('c-'+sid).value.trim();if(!c)return toast('한 줄 코멘트를 입력해주세요',1);
  DB.showcase.push({id:nid('SH'),sid,month:'2026-10',kind:document.getElementById('k-'+sid).dataset.v,url:document.getElementById('u-'+sid).value.trim()||'(링크 없음)',comment:c});toast('대표작 저장');render();
}

/* ============ 관리·설정 ============ */
let ADM='settings';
function adminPage(){
  if(ME.role!='director')return deny();
  const S=DB.settings;
  const SET=[['pass','단어 통과 기준 (30문항 중)','개'],['dropPct','점수 하락 경고 (최근 3회 평균 대비)','%'],['gapDays','기록 공백 기준','일'],['fastPass','나머지 10분 통과 경고 (4주)','회'],['maxCare','오늘 챙길 학생 최대','명'],['incompleteRisk','위험: 나머지 미완 누적 (학기)','회'],['riskDropPct','위험: 4주 평균 하락','%'],['worseRisk','위험: 결과 악화','건'],['riskGapDays','위험: 기록 공백','일']];
  const tab=`<div class="seg" style="margin-bottom:20px">${[['settings','기준값 설정'],['extra','추가 과제 메뉴'],['students','학생·반'],['users','사용자']].map(([k,l])=>`<button class="${ADM==k?'on':''}" onclick="ADM='${k}';render()">${l}</button>`).join('')}</div>`;
  if(ADM=='settings')return tab+`<div class="card"><div class="chead"><h3>자동 규칙 기준값</h3><span class="small muted">시범 운영 초기값 · 바꾸면 모든 화면에 바로 반영</span></div>
    <div class="grid g3" style="gap:14px">${SET.map(([k,l,u])=>`<div class="card flat"><div class="small muted b">${l}</div><div class="row" style="margin-top:8px;flex-wrap:nowrap"><input type="number" value="${S[k]}" onchange="if(!setSetting('${k}',this.value))this.value=DB.settings['${k}']"><span class="muted">${u}</span></div></div>`).join('')}</div></div>`;
  if(ADM=='extra')return tab+`<div class="card"><div class="chead"><h3>추가 과제 바구니 (레벨별 고정 메뉴)</h3></div>
    ${DB.extra.map(e=>`<div class="task"><span class="bd n">${e.level=='all'?'전체':e.level}</span> ${esc(e.title)}<span class="sp"></span><label class="toggle"><input type="checkbox" ${e.active?'checked':''} onchange="DB.extra.find(x=>x.id=='${e.id}').active=this.checked"><i></i></label></div>`).join('')}
    <div class="row" style="margin-top:14px;flex-wrap:nowrap"><select id="exL" style="width:150px"><option value="all">전체</option>${['Starter','Basic','Inter','Advanced','Master'].map(l=>`<option>${l}</option>`).join('')}</select><input id="exT" placeholder="새 과제"><button class="btn pri" onclick="addExtra()">추가</button></div></div>`;
  if(ADM=='users')return tab+`<div class="card"><div class="chead"><h3>사용자</h3><span class="small muted">퇴사 조교 계정은 즉시 비활성화</span></div>
    <div class="tblw"><table class="t"><tr><th>이름</th><th>역할</th><th>활성</th></tr>${DB.users.map(u=>`<tr><td><div class="row" style="gap:8px">${avatar(u.name)}<b>${esc(u.name)}</b></div></td><td>${ROLE[u.role]}</td><td><label class="toggle"><input type="checkbox" ${u.active?'checked':''} ${u.id==ME.id?'disabled':''} onchange="DB.users.find(x=>x.id=='${u.id}').active=this.checked;toast(this.checked?'활성화':'비활성화')"><i></i></label></td></tr>`).join('')}</table></div></div>`;
  return tab+`<div class="card"><div class="chead"><h3>학생 ${DB.students.length}명 · 반 ${DB.classes.length}개</h3><button class="btn" onclick="toast('데모에서는 CSV 가져오기가 동작하지 않습니다',1)">${ic('dl',14)}구글 시트 CSV 가져오기</button><button class="btn pri" onclick="toast('데모: 학생 등록 폼은 다음 단계',1)">${ic('plus',14)}학생 등록</button></div>
    <div class="tblw"><table class="t"><tr><th>이름</th><th>학년</th><th>학교</th><th>담임반</th><th>담임</th><th>원어민반</th><th>상태</th><th>학부모</th></tr>${DB.students.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${s.grade}</td><td>${s.school}</td><td class="small">${dayLabel(CL(s.cls))} ${CL(s.cls).start} ${esc(CL(s.cls).name)}</td><td>${US(s.homeroom).name}</td><td class="small">${esc(CL(s.nclass).name)}</td><td><span class="bd g">${s.status}</span></td><td class="small muted">${phoneOf(s)}</td></tr>`).join('')}</table></div></div>`;
}
const SETTING_RANGE={pass:[10,30],dropPct:[5,50],gapDays:[3,60],fastPass:[1,10],maxCare:[3,10],incompleteRisk:[1,10],riskDropPct:[5,50],worseRisk:[1,10],riskGapDays:[7,90]};
function setSetting(k,v){
  const [mn,mx]=SETTING_RANGE[k],n=Number(v);
  if(String(v).trim()===''||!Number.isInteger(n)||n<mn||n>mx){toast(`${mn}~${mx} 사이 숫자만 가능합니다`,1);return false}
  DB.settings[k]=n;DIRTY=true;toast('저장됨');return true;
}
function addExtra(){const t=$('#exT').value.trim();if(!t)return;DB.extra.push({id:nid('E'),level:$('#exL').value,title:t,active:true});toast('추가됨');render()}

/* ============ toast & boot ============ */
let tt;
function toast(msg,err){$('#toast').innerHTML=`<div class="toast ${err?'err':''}"><span class="ck">${err?'!':'✓'}</span>${esc(msg)}</div>`;clearTimeout(tt);tt=setTimeout(()=>$('#toast').innerHTML='',2600)}
const PAGES={dashboard,home:homePage,entry:entryPage,remedial:remedialPage,students:studentsPage,timeline:timelinePage,report:reportPage,admin:adminPage,showcase:showcasePage};
/* ============ self test (index.html#test) ============ */
const TESTS=[];const T=(name,fn)=>TESTS.push([name,fn]);
function selfTest(){
  const keep={DB,ME,dismissed,RS,DRAFT,M,confirm:window.confirm};
  const fail=[];let pass=0;
  for(const [n,fn] of TESTS){
    DB=buildData();ME=null;dismissed=new Set();RS={};DRAFT={};M={};
    try{fn()===true?pass++:fail.push(n)}catch(e){fail.push(`${n} (${e.message})`)}
    window.confirm=keep.confirm;
  }
  ({DB,ME,dismissed,RS,DRAFT,M}=keep);
  return{pass,fail};
}
T('데이터 생성',()=>DB.students.length==96&&DB.classes.length==20);
// Task 2
T('동명이인 구분',()=>{const g={};DB.students.forEach(s=>(g[s.name]=g[s.name]||[]).push(stLabel(s)));return Object.values(g).every(a=>new Set(a).size==a.length)});
T('연락처 권한',()=>{const s=ST('S1');ME=US('D1');const a=phoneOf(s);ME=US('T2');const b=phoneOf(s);return !a.includes('*')&&b.includes('*')});
T('기준값 범위',()=>!setSetting('pass','0')&&DB.settings.pass==24&&setSetting('pass','26')&&DB.settings.pass==26);
T('원장 티켓 버튼',()=>{ME=US('D1');HOMECLS='C11';return homePage().includes('openTicket(')});
T('상담 요약 텍스트',()=>consultText('S1').includes(ST('S1').name));
// Task 3
T('초안에 부정어 없음',()=>DB.students.every(s=>{const d=aiDraft(bundle(s.id,'2026-09'));return !NEG_WORDS.some(w=>d.includes(w))}));
T('초안에 원본 문장 없음',()=>{const r=DB.care.find(x=>x.type=='behavior'&&x.result=='improved');return !r||!aiDraft(bundle(r.sid,r.created.slice(0,7))).includes(r.finding)});
// Task 4
T('기간 필터가 케어 카드에 반영',()=>{FILT.period='30';ME=US('D1');const h=dashboard();FILT.period='14';return h.includes('기간 내 케어 기록')});
T('리포트 월에 10월 포함',()=>reportMonths().includes('2026-10')&&reportMonths().includes('2026-08'));
// Task 1
T('버튼 두 번 눌러도 선택 유지',()=>{RS.S1={};rs('S1','att','normal');rs('S1','att','normal');return RS.S1.att=='normal'});
T('숙제 버튼 4번 누르면 빈칸 복귀',()=>{DRAFT.x={S1:{hw:{reading:''}}};for(let i=0;i<4;i++)cycHw('x','S1','reading');return DRAFT.x.S1.hw.reading==''});
T('작성 중 케어 창 감지',()=>{M={kind:'care',area:'word',type:null,finding:'',action:null};return modalDirty()});
T('모두 보류는 확인 거절 시 유지',()=>{window.confirm=()=>false;DB.suggestions.push({id:'SGt',cls:'C11',sid:'S1',status:'pending'});confirmSug('C11',false);return DB.suggestions.find(s=>s.id=='SGt').status=='pending'});
T('점수 보정',()=>clampScore('-3')===0&&clampScore('31')===30&&clampScore('25.5')===26&&clampScore('')==='');

DB=buildData();render();
if(location.hash=='#test'){
  const r=selfTest(),msg=r.fail.length?'SELFTEST FAIL '+r.fail.join(' | '):'SELFTEST PASS '+r.pass;
  console.log(msg);render();document.body.insertAdjacentHTML('beforeend',`<pre id="selftest">${esc(msg)}</pre>`);
}
</script>
</body>
